name: mesh-regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mesh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v6

      # Build your firmware before this step and produce build/app.hex.
      - name: Run deterministic mesh regression
        id: firmverse
        uses: Pom4H/firmverse@v1
        with:
          firmware: build/app.hex
          board: pb03f-kit
          mode: mesh
          world: mesh
          nodes: '2'
          ticks: '200'
          strict: 'true'
          expect: |
            READY
            WORLD mesh
            NODE n0
            NODE n1

      - name: Upload mesh log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-mesh-log
          path: ${{ steps.firmverse.outputs.log }}
          if-no-files-found: warn
