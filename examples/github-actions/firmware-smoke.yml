name: firmware-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Replace with the firmware image produced by your repository.
  FIRMWARE_HEX: firmware/build/app.hex

jobs:
  firmverse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v6

      - name: Checkout Firmverse
        uses: actions/checkout@v6
        with:
          repository: Pom4H/firmverse
          # Pin a reviewed tag/commit for production CI.
          ref: main
          path: .firmverse
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Firmverse build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .firmverse/target
          key: firmverse-${{ runner.os }}-${{ hashFiles('.firmverse/Cargo.lock') }}
          restore-keys: |
            firmverse-${{ runner.os }}-

      - name: Build Firmverse
        run: cargo build --release --locked --manifest-path .firmverse/Cargo.toml

      - name: Check firmware image
        run: test -f "$FIRMWARE_HEX"

      - name: Run strict PHY6252 smoke
        run: |
          .firmverse/target/release/firmverse \
            --board pb03f-kit \
            --strict \
            --once \
            --raw \
            "$FIRMWARE_HEX" \
            | tee firmverse.log

      # Add application-specific assertions here, for example:
      # - run: grep -q 'UART application-ready' firmverse.log

      - name: Upload Firmverse log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-smoke-log
          path: firmverse.log
          if-no-files-found: warn
