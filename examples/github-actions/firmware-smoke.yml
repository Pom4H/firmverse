name: firmware-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  firmverse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v6

      # Build your firmware before this step and produce build/app.hex.
      - name: Run strict firmware smoke in Firmverse
        id: firmverse
        uses: Pom4H/firmverse@v1
        with:
          firmware: build/app.hex
          board: pb03f-kit
          strict: 'true'
          expect: |
            UART application-ready

      - name: Upload Firmverse log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-smoke-log
          path: ${{ steps.firmverse.outputs.log }}
          if-no-files-found: warn
