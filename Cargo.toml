[package]
name = "firmverse"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Virtual embedded systems lab for firmware emulation, multi-node simulation and hardware tooling"
repository = "https://github.com/Pom4H/firmverse"
default-run = "firmverse"

[lib]
name = "firmverse"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "firmverse"
path = "src/main.rs"

[[bin]]
name = "phy6252-flash"
path = "src/bin/phy6252-flash.rs"

[lints.rust]
warnings = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# PHY6252 currently enables zmu's ARMv6-M engine. The SoC registry keeps the
# backend boundary explicit so future Cortex-M SoCs can select other zmu profiles.
zmu_cortex_m = { path = "third_party/zmu/zmu_cortex_m", default-features = false, features = ["armv6m"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29"
serialport = { version = "4.7", default-features = false }
