[package]
name = "firmverse"
version = "1.5.0"
edition = "2021"
publish = false
license = "MIT"
description = "Virtual embedded systems lab for firmware emulation, multi-node simulation and hardware tooling"
repository = "https://github.com/Pom4H/firmverse"
default-run = "firmverse"

[lib]
name = "firmverse"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "firmverse"
path = "src/main.rs"

[[bin]]
name = "phy6252-flash"
path = "src/bin/phy6252-flash.rs"

[features]
default = ["armv6m"]
armv6m = ["zmu_cortex_m/armv6m"]
armv7em = ["zmu_cortex_m/armv7em"]

[lints.rust]
warnings = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
serde_json = "1"
# zmu selects the Cortex-M architecture at compile time. The public Action
# builds the default ARMv6-M profile for PHY6252 and an isolated ARMv7E-M
# profile for generic hardware probes such as the reference hardware wallet.
zmu_cortex_m = { path = "third_party/zmu/zmu_cortex_m", default-features = false }

[build-dependencies]
cc = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29"
serialport = { version = "4.7", default-features = false }
