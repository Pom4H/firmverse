[package]
name = "phy6252-emu"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "PHY6252 Cortex-M0 chip emulator (AI-Thinker PB-03F-Kit)"
repository = "https://github.com/Pom4H/phy6252-emu"
default-run = "phy6252"

[[bin]]
name = "phy6252"
path = "src/main.rs"

[lints.rust]
warnings = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
zmu_cortex_m = { path = "third_party/zmu/zmu_cortex_m", default-features = false, features = ["armv6m"] }
