name: Verify FVD1 on AN505 secure aliases once

on:
  push:
    paths:
      - .github/workflows/secure-fvd1-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Apply prepared FVD1 source migration
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/fv.part* | tr -d '\n' | base64 -d > /tmp/patch_firmverse.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/patch_firmverse.py')
          text = path.read_text(encoding='utf-8')
          slash = chr(92)
          pairs = [
              ("'''        script = \"" + slash + "n\".join(",
               "'''        script = \"" + slash + slash + "n\".join("),
              ('        script = "' + slash + 'n".join(commands)',
               '        script = "' + slash + slash + 'n".join(commands)'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'migration newline anchor missing: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile /tmp/patch_firmverse.py
          python3 /tmp/patch_firmverse.py

      - name: Use AN505 secure aliases and firmware-published FVD1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          probe = Path('tools/cortex_m_probe.py')
          text = probe.read_text(encoding='utf-8')

          replacements = [
              (
                  'with tempfile.TemporaryDirectory(prefix="firmverse-") as temporary:',
                  'with tempfile.TemporaryDirectory(prefix=".firmverse-", dir=Path.cwd()) as temporary:',
              ),
              (
                  "f'restore \"{quote_gdb_path(pattern_path)}\" binary '",
                  "f'restore {quote_gdb_path(pattern_path)} binary '",
              ),
              (
                  "f'dump binary memory \"{quote_gdb_path(dump_path)}\" '",
                  "f'dump binary memory {quote_gdb_path(dump_path)} '",
              ),
              (
                  "f'dump binary memory \"{quote_gdb_path(trace_path)}\" '",
                  "f'dump binary memory {quote_gdb_path(trace_path)} '",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'probe anchor missing: {old}')
              text = text.replace(old, new, 1)

          remote = '            f"target remote 127.0.0.1:{port}",\n'
          remote_new = remote + '            "load",\n'
          if remote not in text:
              raise SystemExit('target remote anchor missing')
          text = text.replace(remote, remote_new, 1)

          breakpoint = '            f"hbreak *0x{completion_address:x}",\n'
          startup = (
              '            f"set *(unsigned int*)0xe000ed08 = 0x{args.flash_origin:x}",\n'
              + '            "set $control = 0",\n'
              + '            "set $msplim = 0",\n'
              + '            f"set $msp = *(unsigned int*)0x{args.flash_origin:x}",\n'
              + '            f"set $sp = *(unsigned int*)0x{args.flash_origin:x}",\n'
              + '            f"set $pc = (*(unsigned int*)0x{args.flash_origin + 4:x}) & 0xfffffffe",\n'
              + '            "set $xpsr = 0x01000000",\n'
              + breakpoint
          )
          if breakpoint not in text:
              raise SystemExit('breakpoint anchor missing')
          text = text.replace(breakpoint, startup, 1)
          probe.write_text(text, encoding='utf-8')

          action = Path('actions/cortex-m-probe/action.yml')
          action_text = action.read_text(encoding='utf-8')
          action_text = action_text.replace('default: "0x20000000"', 'default: "0x38000000"', 1)
          action_text = action_text.replace('default: "0x00000000"', 'default: "0x10000000"', 1)
          action.write_text(action_text, encoding='utf-8')

          workflow = Path('.github/workflows/cortex-m-probe.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          address_pairs = [
              ('.word 0x20040000', '.word 0x38040000'),
              ('.word reset + 1', '.word reset'),
              ('FLASH (rx)  : ORIGIN = 0x00000000', 'FLASH (rx)  : ORIGIN = 0x10000000'),
              ('RAM   (rwx) : ORIGIN = 0x20000000', 'RAM   (rwx) : ORIGIN = 0x38000000'),
              ('ram-origin: "0x20000000"', 'ram-origin: "0x38000000"'),
              ('flash-origin: "0x00000000"', 'flash-origin: "0x10000000"'),
          ]
          for old, new in address_pairs:
              if old not in workflow_text:
                  raise SystemExit(f'durable workflow anchor missing: {old}')
              workflow_text = workflow_text.replace(old, new, 1)

          old_trace = '''          .section .data.device_trace,"aw",%progbits
          .align 2
          .global firmverse_device_trace
          .type firmverse_device_trace,%object
          firmverse_device_trace:
              .word 0x31445646
              .word 1
              .word 64
              .word 1
              .word 0x1f
              .word 3
              .word 2
              .word 0x12345678
              .word 32
              .word 0x87654321
              .word 2
              .word 2
              .word 0xaabbccdd
              .word 1
              .word 0xddccbbaa
              .word 0

'''
          new_trace = '''          .section .bss.device_trace,"aw",%nobits
          .align 2
          .global firmverse_device_trace
          .type firmverse_device_trace,%object
          firmverse_device_trace:
              .space 64
          .size firmverse_device_trace, .-firmverse_device_trace

          .section .rodata.device_trace_init,"a",%progbits
          .align 2
          trace_init:
              .word 0x31445646, 1, 64, 1, 0x1f, 3, 2, 0x12345678
              .word 32, 0x87654321, 2, 2, 0xaabbccdd, 1, 0xddccbbaa, 0
          trace_init_end:

'''
          if old_trace not in workflow_text:
              raise SystemExit('durable FVD1 fixture block missing')
          workflow_text = workflow_text.replace(old_trace, new_trace, 1)

          reset_anchor = '''          reset:
              sub.w sp, sp, #256
'''
          reset_with_publish = '''          reset:
              ldr r0, =trace_init
              ldr r1, =firmverse_device_trace
              ldr r2, =trace_init_end
          0:
              ldr r3, [r0], #4
              str r3, [r1], #4
              cmp r0, r2
              blo 0b
              sub.w sp, sp, #256
'''
          if reset_anchor not in workflow_text:
              raise SystemExit('durable reset anchor missing')
          workflow_text = workflow_text.replace(reset_anchor, reset_with_publish, 1)
          workflow.write_text(workflow_text, encoding='utf-8')

          docs = Path('docs/DEVICE_TRACE_ABI.md')
          docs.write_text(
              docs.read_text(encoding='utf-8')
              + '\nFor the default `mps2-an505` backend, Firmverse links secure code at '
                '`0x10000000` and uses secure SRAM at `0x38000000`, matching '
                'the board model Secure VTOR and TrustZone aliases. The trace '
                'must be published by executing firmware before `firmverse_done`.\n',
              encoding='utf-8',
          )
          PY
          python3 -m py_compile tools/cortex_m_probe.py
          python3 -m unittest tools/test_cortex_m_probe.py

      - name: Install Cortex-M execution dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-arm gdb-multiarch

      - name: Install LLVM inspection tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Build secure Cortex-M33 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fixture
          cat > target/fixture/device.S <<'ASM'
          .syntax unified
          .cpu cortex-m33
          .thumb

          .section .vector_table,"a",%progbits
          .word 0x38040000
          .word reset
          .rept 126
          .word fault_handler
          .endr

          .section .bss.device_trace,"aw",%nobits
          .align 2
          .global firmverse_device_trace
          .type firmverse_device_trace,%object
          firmverse_device_trace:
              .space 64
          .size firmverse_device_trace, .-firmverse_device_trace

          .section .rodata.device_trace_init,"a",%progbits
          .align 2
          trace_init:
              .word 0x31445646, 1, 64, 1, 0x1f, 3, 2, 0x12345678
              .word 32, 0x87654321, 2, 2, 0xaabbccdd, 1, 0xddccbbaa, 0
          trace_init_end:

          .section .text.reset,"ax",%progbits
          .thumb_func
          .global reset
          reset:
              ldr r0, =trace_init
              ldr r1, =firmverse_device_trace
              ldr r2, =trace_init_end
          0:
              ldr r3, [r0], #4
              str r3, [r1], #4
              cmp r0, r2
              blo 0b
              sub.w sp, sp, #256
              movs r0, #0x42
              str r0, [sp]
              add.w sp, sp, #256
              bl firmverse_done
          1:
              b 1b

          .thumb_func
          .global firmverse_done
          firmverse_done:
              b .

          .thumb_func
          fault_handler:
              b .
          ASM
          cat > target/fixture/linker.ld <<'LD'
          ENTRY(reset)
          MEMORY {
            FLASH (rx)  : ORIGIN = 0x10000000, LENGTH = 1M
            RAM   (rwx) : ORIGIN = 0x38000000, LENGTH = 256K
          }
          SECTIONS {
            .vector_table ORIGIN(FLASH) : { KEEP(*(.vector_table)) } > FLASH
            .text : { *(.text*) } > FLASH
            .rodata : { *(.rodata*) } > FLASH
            .data : { *(.data*) } > RAM AT> FLASH
            .bss (NOLOAD) : { *(.bss*) *(COMMON) } > RAM
          }
          LD
          clang --target=arm-none-eabi -mcpu=cortex-m33 -mthumb \
            -nostdlib -fuse-ld=lld -Wl,-T,target/fixture/linker.ld \
            -o target/fixture/device.elf target/fixture/device.S

      - name: Execute real ELF and read firmware-published FVD1
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc +1.98.0 -vV | sed -n 's/^host: //p')"
          llvm_root="$(rustc +1.98.0 --print sysroot)/lib/rustlib/${host}/bin"
          python3 tools/cortex_m_probe.py \
            --elf target/fixture/device.elf \
            --target thumbv8m.main-none-eabi \
            --machine mps2-an505 \
            --cpu cortex-m33 \
            --ram-origin 0x38000000 \
            --ram-length 262144 \
            --flash-origin 0x10000000 \
            --flash-length 1048576 \
            --done-symbol firmverse_done \
            --device-trace-symbol firmverse_device_trace \
            --required-device-capabilities 0x1f \
            --stack-limit-bytes 4096 \
            --output-dir target/virtual-board-report \
            --llvm-nm "$llvm_root/llvm-nm" \
            --llvm-size "$llvm_root/llvm-size"

      - name: Verify structured device evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          report = json.load(open('target/virtual-board-report/firmverse-report.json', encoding='utf-8'))
          trace = report['device_trace']
          assert report['status'] == 'pass'
          assert trace['status'] == 'pass'
          assert trace['capabilities'] == 31
          assert trace['button_events'] == 3
          assert trace['display_frames'] == 2
          assert trace['trng_bytes'] == 32
          assert trace['storage_generation'] == 2
          assert trace['secure_element_ops'] == 1
          PY

      - name: Commit verified implementation and remove migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration
          rm -f \
            .github/workflows/secure-fvd1-once.yml \
            .github/workflows/apply-fvd1-direct-once.yml \
            .github/workflows/apply-fvd1-once.yml \
            .github/workflows/virtual-board-abi-once.yml \
            .github/workflows/run-virtual-board-migration-once.yml \
            .github/workflows/inspect-recovered-migration-once.yml \
            .github/workflows/finalize-cortex-probe-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Cortex-M virtual device trace ABI"
          git push
