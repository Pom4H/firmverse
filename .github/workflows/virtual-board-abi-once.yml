name: Virtual board ABI migration once

on:
  push:
    paths:
      - .github/workflows/virtual-board-abi-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Add device trace ABI to Cortex-M backend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          probe = "tools/cortex_m_probe.py"
          replace(probe, "import socket\nimport subprocess", "import socket\nimport struct\nimport subprocess")
          replace(
              probe,
              "PATTERN_BYTE = 0xA5\n",
              "PATTERN_BYTE = 0xA5\n"
              "DEVICE_TRACE_MAGIC = 0x31445646  # little-endian ASCII FVD1\n"
              "DEVICE_TRACE_VERSION = 1\n"
              "DEVICE_TRACE_WORDS = 16\n"
              "DEVICE_TRACE_BYTES = DEVICE_TRACE_WORDS * 4\n"
              "DEVICE_STATUS = {0: \\\"running\\\", 1: \\\"pass\\\", 2: \\\"fail\\\"}\n",
          )
          replace(
              probe,
              "@dataclass(frozen=True)\nclass ProbeReport:\n",
              "@dataclass(frozen=True)\n"
              "class DeviceTrace:\n"
              "    symbol: str\n"
              "    address: int\n"
              "    magic: int\n"
              "    version: int\n"
              "    byte_len: int\n"
              "    status: str\n"
              "    status_code: int\n"
              "    capabilities: int\n"
              "    button_events: int\n"
              "    display_frames: int\n"
              "    display_digest: int\n"
              "    trng_bytes: int\n"
              "    trng_digest: int\n"
              "    storage_commits: int\n"
              "    storage_generation: int\n"
              "    storage_digest: int\n"
              "    secure_element_ops: int\n"
              "    secure_element_digest: int\n"
              "    failure_code: int\n\n\n"
              "@dataclass(frozen=True)\n"
              "class ProbeReport:\n",
          )
          replace(
              probe,
              "    cycle_count_status: str\n    qemu_version: str\n",
              "    cycle_count_status: str\n"
              "    device_trace: DeviceTrace | None\n"
              "    device_trace_errors: tuple[str, ...]\n"
              "    qemu_version: str\n",
          )
          replace(
              probe,
              "def scan_stack_watermark(data: bytes, pattern: int = PATTERN_BYTE) -> tuple[int, int]:\n"
              "    changed = [index for index, value in enumerate(data) if value != pattern]\n"
              "    if not changed:\n"
              "        raise ValueError(\\\"stack pattern was untouched; firmware probably did not execute\\\")\n"
              "    lowest_changed = min(changed)\n"
              "    return len(data) - lowest_changed, lowest_changed\n",
              "def scan_stack_watermark(data: bytes, pattern: int = PATTERN_BYTE) -> tuple[int, int]:\n"
              "    changed = [index for index, value in enumerate(data) if value != pattern]\n"
              "    if not changed:\n"
              "        raise ValueError(\\\"stack pattern was untouched; firmware probably did not execute\\\")\n"
              "    lowest_changed = min(changed)\n"
              "    return len(data) - lowest_changed, lowest_changed\n\n\n"
              "def parse_device_trace(data: bytes, symbol: str, address: int) -> DeviceTrace:\n"
              "    if len(data) != DEVICE_TRACE_BYTES:\n"
              "        raise ValueError(\n"
              "            f\\\"device trace must be {DEVICE_TRACE_BYTES} bytes, got {len(data)}\\\"\n"
              "        )\n"
              "    words = struct.unpack(\\\"<16I\\\", data)\n"
              "    status_code = words[3]\n"
              "    return DeviceTrace(\n"
              "        symbol=symbol,\n"
              "        address=address,\n"
              "        magic=words[0],\n"
              "        version=words[1],\n"
              "        byte_len=words[2],\n"
              "        status=DEVICE_STATUS.get(status_code, f\\\"unknown-{status_code}\\\"),\n"
              "        status_code=status_code,\n"
              "        capabilities=words[4],\n"
              "        button_events=words[5],\n"
              "        display_frames=words[6],\n"
              "        display_digest=words[7],\n"
              "        trng_bytes=words[8],\n"
              "        trng_digest=words[9],\n"
              "        storage_commits=words[10],\n"
              "        storage_generation=words[11],\n"
              "        storage_digest=words[12],\n"
              "        secure_element_ops=words[13],\n"
              "        secure_element_digest=words[14],\n"
              "        failure_code=words[15],\n"
              "    )\n\n\n"
              "def validate_device_trace(trace: DeviceTrace, required_capabilities: int) -> tuple[str, ...]:\n"
              "    errors: list[str] = []\n"
              "    if trace.magic != DEVICE_TRACE_MAGIC:\n"
              "        errors.append(f\\\"invalid device trace magic 0x{trace.magic:08x}\\\")\n"
              "    if trace.version != DEVICE_TRACE_VERSION:\n"
              "        errors.append(f\\\"unsupported device trace version {trace.version}\\\")\n"
              "    if trace.byte_len != DEVICE_TRACE_BYTES:\n"
              "        errors.append(f\\\"device trace byte_len is {trace.byte_len}, expected {DEVICE_TRACE_BYTES}\\\")\n"
              "    if trace.status != \\\"pass\\\":\n"
              "        errors.append(\n"
              "            f\\\"virtual board status is {trace.status!r}, failure_code={trace.failure_code}\\\"\n"
              "        )\n"
              "    missing = required_capabilities & ~trace.capabilities\n"
              "    if missing:\n"
              "        errors.append(f\\\"virtual board is missing capability mask 0x{missing:08x}\\\")\n"
              "    return tuple(errors)\n",
          )
          replace(
              probe,
              "    completion_address, completion_symbol = find_symbol(llvm_nm, elf, args.done_symbol)\n\n"
              "    stack_top = args.ram_origin + args.ram_length\n",
              "    completion_address, completion_symbol = find_symbol(llvm_nm, elf, args.done_symbol)\n"
              "    device_trace_address: int | None = None\n"
              "    device_trace_symbol: str | None = None\n"
              "    if args.device_trace_symbol:\n"
              "        device_trace_address, device_trace_symbol = find_symbol(\n"
              "            llvm_nm, elf, args.device_trace_symbol\n"
              "        )\n\n"
              "    stack_top = args.ram_origin + args.ram_length\n",
          )
          replace(
              probe,
              "        dump_path = temp / \\\"stack-after.bin\\\"\n        gdb_script = temp / \\\"probe.gdb\\\"\n",
              "        dump_path = temp / \\\"stack-after.bin\\\"\n"
              "        trace_path = temp / \\\"device-trace.bin\\\"\n"
              "        gdb_script = temp / \\\"probe.gdb\\\"\n",
          )
          old_script = '''        script = "\\n".join(
            [
                "set pagination off",
                "set confirm off",
                "set remotetimeout 10",
                f"target remote 127.0.0.1:{port}",
                (
                    f'restore "{quote_gdb_path(pattern_path)}" binary '
                    f"0x{pattern_start:x}"
                ),
                f"hbreak *0x{completion_address:x}",
                "continue",
                (
                    f'dump binary memory "{quote_gdb_path(dump_path)}" '
                    f"0x{pattern_start:x} 0x{stack_top:x}"
                ),
                "info registers sp pc lr",
                "detach",
                "quit",
                "",
            ]
        )
'''
          new_script = '''        commands = [
            "set pagination off",
            "set confirm off",
            "set remotetimeout 10",
            f"target remote 127.0.0.1:{port}",
            (
                f'restore "{quote_gdb_path(pattern_path)}" binary '
                f"0x{pattern_start:x}"
            ),
            f"hbreak *0x{completion_address:x}",
            "continue",
            (
                f'dump binary memory "{quote_gdb_path(dump_path)}" '
                f"0x{pattern_start:x} 0x{stack_top:x}"
            ),
        ]
        if device_trace_address is not None:
            commands.append(
                f'dump binary memory "{quote_gdb_path(trace_path)}" '
                f"0x{device_trace_address:x} 0x{device_trace_address + DEVICE_TRACE_BYTES:x}"
            )
        commands.extend(["info registers sp pc lr", "detach", "quit", ""])
        script = "\\n".join(commands)
'''
          replace(probe, old_script, new_script)
          replace(
              probe,
              "        final_sp = parse_register(combined_gdb, \\\"sp\\\")\n\n"
              "    recommended_stack = align_up(\n",
              "        final_sp = parse_register(combined_gdb, \\\"sp\\\")\n"
              "        device_trace = None\n"
              "        device_trace_errors: tuple[str, ...] = ()\n"
              "        if device_trace_address is not None and device_trace_symbol is not None:\n"
              "            if not trace_path.is_file():\n"
              "                raise RuntimeError(\\\"GDB reached completion but produced no device trace dump\\\")\n"
              "            device_trace = parse_device_trace(\n"
              "                trace_path.read_bytes(), device_trace_symbol, device_trace_address\n"
              "            )\n"
              "            device_trace_errors = validate_device_trace(\n"
              "                device_trace, args.required_device_capabilities\n"
              "            )\n"
              "        elif args.required_device_capabilities:\n"
              "            device_trace_errors = (\n"
              "                \\\"required device capabilities were requested without a device trace symbol\\\",\n"
              "            )\n\n"
              "    recommended_stack = align_up(\n",
          )
          replace(
              probe,
              "    status = \\\"pass\\\" if headroom >= 0 else \\\"fail\\\"\n",
              "    status = \\\"pass\\\" if headroom >= 0 and not device_trace_errors else \\\"fail\\\"\n",
          )
          replace(
              probe,
              "        cycle_count_status=(\n"
              "            \\\"not available from the initial QEMU backend; Firmverse instruction/cycle \\\"\n"
              "            \\\"accounting or a target DWT counter is required before selecting clock MHz\\\"\n"
              "        ),\n"
              "        qemu_version=first_line([str(qemu), \\\"--version\\\"]),\n",
              "        cycle_count_status=(\n"
              "            \\\"not available from the initial QEMU backend; Firmverse instruction/cycle \\\"\n"
              "            \\\"accounting or a target DWT counter is required before selecting clock MHz\\\"\n"
              "        ),\n"
              "        device_trace=device_trace,\n"
              "        device_trace_errors=device_trace_errors,\n"
              "        qemu_version=first_line([str(qemu), \\\"--version\\\"]),\n",
          )
          start = Path(probe).read_text(encoding="utf-8").index("def render_markdown(report: ProbeReport) -> str:\n")
          end = Path(probe).read_text(encoding="utf-8").index("\n\ndef main() -> int:\n", start)
          text = Path(probe).read_text(encoding="utf-8")
          render = '''def render_markdown(report: ProbeReport) -> str:
    result = "PASS" if report.status == "pass" else "FAIL"
    final_sp = f"`0x{report.final_sp:08x}`" if report.final_sp is not None else "unavailable"
    lines = [
        f"# Firmverse Cortex-M probe — {result}",
        "",
        "| Metric | Result |",
        "| --- | ---: |",
        f"| Target | `{report.target}` |",
        f"| Virtual board | `{report.machine}` / `{report.cpu}` |",
        f"| Linked Flash | {kib(report.flash_bytes)} |",
        f"| Static RAM | {kib(report.static_ram_bytes)} |",
        f"| Measured peak stack | **{kib(report.peak_stack_bytes)}** |",
        f"| Current stack gate | {kib(report.stack_limit_bytes)} |",
        f"| Stack headroom | {kib(report.stack_headroom_bytes)} |",
        f"| Recommended stack | {kib(report.recommended_stack_bytes)} |",
        f"| Final SP | {final_sp} |",
        f"| Emulator wall time | {report.wall_time_ms} ms |",
    ]
    if report.device_trace is not None:
        trace = report.device_trace
        lines.extend(
            [
                "",
                "## Virtual device trace",
                "",
                "| Device signal | Result |",
                "| --- | ---: |",
                f"| ABI | `FVD1` / v{trace.version} / {trace.byte_len} B |",
                f"| Status | **{trace.status.upper()}** |",
                f"| Capability mask | `0x{trace.capabilities:08x}` |",
                f"| Button events | {trace.button_events} |",
                f"| Display frames | {trace.display_frames} |",
                f"| Display digest | `0x{trace.display_digest:08x}` |",
                f"| TRNG bytes | {trace.trng_bytes} |",
                f"| TRNG digest | `0x{trace.trng_digest:08x}` |",
                f"| Storage commits | {trace.storage_commits} |",
                f"| Storage generation | {trace.storage_generation} |",
                f"| Storage digest | `0x{trace.storage_digest:08x}` |",
                f"| Secure-element operations | {trace.secure_element_ops} |",
                f"| Secure-element digest | `0x{trace.secure_element_digest:08x}` |",
                f"| Failure code | `0x{trace.failure_code:08x}` |",
            ]
        )
    if report.device_trace_errors:
        lines.extend(["", "## Device gate failures", ""])
        lines.extend(f"- {error}" for error in report.device_trace_errors)
    lines.extend(
        [
            "",
            "The stack value is measured by painting the available RAM before reset,",
            "running the real Cortex-M ELF to its completion symbol, and scanning the",
            "remaining pattern. The optional FVD1 block is read directly from guest RAM",
            "after completion, so CI can assert virtual buttons, display, entropy, atomic",
            "storage and secure-element boundary behavior without parsing debug text.",
            "",
            f"Cycle status: {report.cycle_count_status}.",
            "",
            f"ELF SHA-256: `{report.elf_sha256}`.",
            "",
        ]
    )
    return "\\n".join(lines)
'''
          Path(probe).write_text(text[:start] + render + text[end:], encoding="utf-8")
          replace(
              probe,
              "    parser.add_argument(\\\"--done-symbol\\\", default=\\\"firmverse_done\\\")\n"
              "    parser.add_argument(\\\"--stack-limit-bytes\\\", type=parse_int, default=32 * 1024)\n",
              "    parser.add_argument(\\\"--done-symbol\\\", default=\\\"firmverse_done\\\")\n"
              "    parser.add_argument(\\\"--device-trace-symbol\\\", default=\\\"\\\")\n"
              "    parser.add_argument(\\\"--required-device-capabilities\\\", type=parse_int, default=0)\n"
              "    parser.add_argument(\\\"--stack-limit-bytes\\\", type=parse_int, default=32 * 1024)\n",
          )

          tests = Path("tools/test_cortex_m_probe.py")
          text = tests.read_text(encoding="utf-8")
          anchor = "\n\nif __name__ == \\\"__main__\\\":\n"
          additions = '''

    def test_parses_fvd1_device_trace(self) -> None:
        words = [
            cortex_m_probe.DEVICE_TRACE_MAGIC,
            1,
            cortex_m_probe.DEVICE_TRACE_BYTES,
            1,
            0x1F,
            3,
            2,
            0x12345678,
            32,
            0x87654321,
            2,
            2,
            0xAABBCCDD,
            1,
            0xDDCCBBAA,
            0,
        ]
        data = __import__("struct").pack("<16I", *words)
        trace = cortex_m_probe.parse_device_trace(data, "trace", 0x20000100)
        self.assertEqual(trace.status, "pass")
        self.assertEqual(trace.capabilities, 0x1F)
        self.assertEqual(trace.storage_generation, 2)
        self.assertEqual(cortex_m_probe.validate_device_trace(trace, 0x1F), ())

    def test_device_trace_fails_closed(self) -> None:
        words = [cortex_m_probe.DEVICE_TRACE_MAGIC, 1, 64, 2, 1] + [0] * 11
        data = __import__("struct").pack("<16I", *words)
        trace = cortex_m_probe.parse_device_trace(data, "trace", 0x20000100)
        errors = cortex_m_probe.validate_device_trace(trace, 0x1F)
        self.assertTrue(any("status" in error for error in errors))
        self.assertTrue(any("capability" in error for error in errors))
'''
          if anchor not in text:
              raise SystemExit("test insertion anchor missing")
          tests.write_text(text.replace(anchor, additions + anchor, 1), encoding="utf-8")

          action = "actions/cortex-m-probe/action.yml"
          replace(
              action,
              "  stack-limit-bytes:\n    description: Fail when measured peak stack exceeds this value\n",
              "  device-trace-symbol:\n"
              "    description: Optional symbol containing the 64-byte FVD1 device trace\n"
              "    required: false\n"
              "    default: ''\n"
              "  required-device-capabilities:\n"
              "    description: Capability bitmask that the FVD1 trace must expose\n"
              "    required: false\n"
              "    default: '0'\n"
              "  stack-limit-bytes:\n"
              "    description: Fail when measured peak stack exceeds this value\n",
          )
          replace(
              action,
              "  recommended-stack-bytes:\n    description: Peak plus Firmverse safety margin\n    value: ${{ steps.probe.outputs.recommended-stack-bytes }}\n",
              "  recommended-stack-bytes:\n"
              "    description: Peak plus Firmverse safety margin\n"
              "    value: ${{ steps.probe.outputs.recommended-stack-bytes }}\n"
              "  device-status:\n"
              "    description: FVD1 virtual-board status when a trace is requested\n"
              "    value: ${{ steps.probe.outputs.device-status }}\n"
              "  device-capabilities:\n"
              "    description: FVD1 virtual-board capability mask\n"
              "    value: ${{ steps.probe.outputs.device-capabilities }}\n",
          )
          replace(
              action,
              "        INPUT_DONE_SYMBOL: ${{ inputs.done-symbol }}\n        INPUT_STACK_LIMIT: ${{ inputs.stack-limit-bytes }}\n",
              "        INPUT_DONE_SYMBOL: ${{ inputs.done-symbol }}\n"
              "        INPUT_DEVICE_TRACE_SYMBOL: ${{ inputs.device-trace-symbol }}\n"
              "        INPUT_REQUIRED_DEVICE_CAPABILITIES: ${{ inputs.required-device-capabilities }}\n"
              "        INPUT_STACK_LIMIT: ${{ inputs.stack-limit-bytes }}\n",
          )
          replace(
              action,
              "          --done-symbol \\\"$INPUT_DONE_SYMBOL\\\" \\\\\n          --stack-limit-bytes \\\"$INPUT_STACK_LIMIT\\\" \\\\\n",
              "          --done-symbol \\\"$INPUT_DONE_SYMBOL\\\" \\\\\n"
              "          --device-trace-symbol \\\"$INPUT_DEVICE_TRACE_SYMBOL\\\" \\\\\n"
              "          --required-device-capabilities \\\"$INPUT_REQUIRED_DEVICE_CAPABILITIES\\\" \\\\\n"
              "          --stack-limit-bytes \\\"$INPUT_STACK_LIMIT\\\" \\\\\n",
          )
          replace(
              action,
              "        recommended=\\\"$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[\\\"recommended_stack_bytes\\\"])' \\\"$report_json\\\")\\\"\n"
              "        echo \\\"report-json=$report_json\\\" >> \\\"$GITHUB_OUTPUT\\\"\n",
              "        recommended=\\\"$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[\\\"recommended_stack_bytes\\\"])' \\\"$report_json\\\")\\\"\n"
              "        device_status=\\\"$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1])).get(\\\"device_trace\\\"); print(value.get(\\\"status\\\", \\\"\\\") if value else \\\"\\\")' \\\"$report_json\\\")\\\"\n"
              "        device_capabilities=\\\"$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1])).get(\\\"device_trace\\\"); print(value.get(\\\"capabilities\\\", 0) if value else 0)' \\\"$report_json\\\")\\\"\n"
              "        echo \\\"report-json=$report_json\\\" >> \\\"$GITHUB_OUTPUT\\\"\n",
          )
          replace(
              action,
              "        echo \\\"recommended-stack-bytes=$recommended\\\" >> \\\"$GITHUB_OUTPUT\\\"\n        cat \\\"$report_markdown\\\" >> \\\"$GITHUB_STEP_SUMMARY\\\"\n",
              "        echo \\\"recommended-stack-bytes=$recommended\\\" >> \\\"$GITHUB_OUTPUT\\\"\n"
              "        echo \\\"device-status=$device_status\\\" >> \\\"$GITHUB_OUTPUT\\\"\n"
              "        echo \\\"device-capabilities=$device_capabilities\\\" >> \\\"$GITHUB_OUTPUT\\\"\n"
              "        cat \\\"$report_markdown\\\" >> \\\"$GITHUB_STEP_SUMMARY\\\"\n",
          )

          workflow = ".github/workflows/cortex-m-probe.yml"
          replace(
              workflow,
              "      - tools/test_cortex_m_probe.py\n",
              "      - tools/test_cortex_m_probe.py\n      - docs/DEVICE_TRACE_ABI.md\n",
          )
          # The path occurs in both push and pull_request filters.
          replace(
              workflow,
              "      - tools/test_cortex_m_probe.py\n",
              "      - tools/test_cortex_m_probe.py\n      - docs/DEVICE_TRACE_ABI.md\n",
          )
          replace(
              workflow,
              "          .section .text.reset,\\\"ax\\\",%progbits\n",
              "          .section .data.device_trace,\\\"aw\\\",%progbits\n"
              "          .align 2\n"
              "          .global firmverse_device_trace\n"
              "          .type firmverse_device_trace,%object\n"
              "          firmverse_device_trace:\n"
              "              .word 0x31445646\n"
              "              .word 1\n"
              "              .word 64\n"
              "              .word 1\n"
              "              .word 0x1f\n"
              "              .word 3\n"
              "              .word 2\n"
              "              .word 0x12345678\n"
              "              .word 32\n"
              "              .word 0x87654321\n"
              "              .word 2\n"
              "              .word 2\n"
              "              .word 0xaabbccdd\n"
              "              .word 1\n"
              "              .word 0xddccbbaa\n"
              "              .word 0\n\n"
              "          .section .text.reset,\\\"ax\\\",%progbits\n",
          )
          replace(
              workflow,
              "          stack-limit-bytes: \\\"4096\\\"\n          output-dir: target/firmverse-report\n",
              "          device-trace-symbol: firmverse_device_trace\n"
              "          required-device-capabilities: \\\"0x1f\\\"\n"
              "          stack-limit-bytes: \\\"4096\\\"\n"
              "          output-dir: target/firmverse-report\n",
          )
          replace(
              workflow,
              "        env:\n          PEAK_STACK: ${{ steps.firmverse.outputs.peak-stack-bytes }}\n        run: |\n          set -euo pipefail\n          test \\\"$PEAK_STACK\\\" -ge 768\n          test \\\"$PEAK_STACK\\\" -le 1024\n",
              "        env:\n"
              "          PEAK_STACK: ${{ steps.firmverse.outputs.peak-stack-bytes }}\n"
              "          DEVICE_STATUS: ${{ steps.firmverse.outputs.device-status }}\n"
              "          DEVICE_CAPABILITIES: ${{ steps.firmverse.outputs.device-capabilities }}\n"
              "          REPORT_JSON: ${{ steps.firmverse.outputs.report-json }}\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          test \\\"$PEAK_STACK\\\" -ge 768\n"
              "          test \\\"$PEAK_STACK\\\" -le 1024\n"
              "          test \\\"$DEVICE_STATUS\\\" = pass\n"
              "          test \\\"$DEVICE_CAPABILITIES\\\" = 31\n"
              "          python3 - \\\"$REPORT_JSON\\\" <<'PY'\n"
              "          import json, sys\n"
              "          trace = json.load(open(sys.argv[1], encoding='utf-8'))['device_trace']\n"
              "          assert trace['button_events'] == 3\n"
              "          assert trace['display_frames'] == 2\n"
              "          assert trace['trng_bytes'] == 32\n"
              "          assert trace['storage_generation'] == 2\n"
              "          assert trace['secure_element_ops'] == 1\n"
              "          PY\n",
          )

          Path("docs/DEVICE_TRACE_ABI.md").write_text(
              '''# Firmverse virtual-device trace ABI

`FVD1` is a 64-byte little-endian block exported by Cortex-M firmware and read
from guest RAM after the completion breakpoint. It is deliberately data-only:
CI does not depend on debug strings or timing-sensitive UART output.

| Word | Field | Meaning |
| ---: | --- | --- |
| 0 | magic | `0x31445646` (`FVD1`) |
| 1 | version | ABI version, currently `1` |
| 2 | byte length | Must be `64` |
| 3 | status | `0` running, `1` pass, `2` fail |
| 4 | capabilities | buttons `1`, display `2`, TRNG `4`, atomic storage `8`, secure-element boundary `16` |
| 5 | button events | Consumed physical-input events |
| 6–7 | display | Presented frame count and deterministic digest |
| 8–9 | TRNG | Generated byte count and digest |
| 10–12 | storage | Successful commits, selected generation and record digest |
| 13–14 | secure element | Boundary operation count and response digest |
| 15 | failure code | Firmware-defined non-zero diagnostic |

A workflow requests the trace with `device-trace-symbol` and can fail closed on
missing behavior through `required-device-capabilities`. The ABI describes
observable device behavior; it does not claim electrical, timing or side-channel
fidelity. Those remain hardware-in-the-loop responsibilities.
''',
              encoding="utf-8",
          )

          docs = Path("docs/HARDWARE_WALLET.md")
          text = docs.read_text(encoding="utf-8")
          if "DEVICE_TRACE_ABI.md" not in text:
              text += "\n## Virtual device contract\n\nThe reusable Cortex-M action can also read the `FVD1` RAM trace described in [`DEVICE_TRACE_ABI.md`](DEVICE_TRACE_ABI.md). This is the stable boundary for virtual buttons, display, entropy, journaled storage and secure-element operations.\n"
              docs.write_text(text, encoding="utf-8")

          Path(".github/workflows/finalize-cortex-probe-once.yml").unlink(missing_ok=True)
          PY

          python3 -m py_compile tools/cortex_m_probe.py
          python3 -m unittest tools/test_cortex_m_probe.py

      - name: Install execution dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-arm gdb-multiarch

      - name: Install LLVM inspection tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Exercise FVD1 against a real Cortex-M33 ELF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fixture target/virtual-board-report
          cat > target/fixture/device.S <<'ASM'
          .syntax unified
          .cpu cortex-m33
          .thumb

          .section .vector_table,"a",%progbits
          .word 0x20040000
          .word reset + 1
          .rept 126
          .word 0
          .endr

          .section .data.device_trace,"aw",%progbits
          .align 2
          .global firmverse_device_trace
          firmverse_device_trace:
              .word 0x31445646, 1, 64, 1, 0x1f, 3, 2, 0x12345678
              .word 32, 0x87654321, 2, 2, 0xaabbccdd, 1, 0xddccbbaa, 0

          .section .text.reset,"ax",%progbits
          .thumb_func
          .global reset
          reset:
              sub.w sp, sp, #256
              movs r0, #0x42
              str r0, [sp]
              add.w sp, sp, #256
              bl firmverse_done
          1:  b 1b

          .thumb_func
          .global firmverse_done
          firmverse_done:
              b .
          ASM
          cat > target/fixture/linker.ld <<'LD'
          ENTRY(reset)
          MEMORY {
            FLASH (rx)  : ORIGIN = 0x00000000, LENGTH = 1M
            RAM   (rwx) : ORIGIN = 0x20000000, LENGTH = 256K
          }
          SECTIONS {
            .vector_table ORIGIN(FLASH) : { KEEP(*(.vector_table)) } > FLASH
            .text : { *(.text*) } > FLASH
            .rodata : { *(.rodata*) } > FLASH
            .data : { *(.data*) } > RAM AT> FLASH
            .bss (NOLOAD) : { *(.bss*) *(COMMON) } > RAM
          }
          LD
          clang --target=arm-none-eabi -mcpu=cortex-m33 -mthumb -nostdlib -fuse-ld=lld \
            -Wl,-T,target/fixture/linker.ld -o target/fixture/device.elf target/fixture/device.S
          host="$(rustc +1.98.0 -vV | sed -n 's/^host: //p')"
          llvm_root="$(rustc +1.98.0 --print sysroot)/lib/rustlib/${host}/bin"
          python3 tools/cortex_m_probe.py \
            --elf target/fixture/device.elf \
            --target thumbv8m.main-none-eabi \
            --machine mps2-an505 \
            --cpu cortex-m33 \
            --done-symbol firmverse_done \
            --device-trace-symbol firmverse_device_trace \
            --required-device-capabilities 0x1f \
            --stack-limit-bytes 4096 \
            --output-dir target/virtual-board-report \
            --llvm-nm "$llvm_root/llvm-nm" \
            --llvm-size "$llvm_root/llvm-size"
          python3 - <<'PY'
          import json
          report = json.load(open('target/virtual-board-report/firmverse-report.json', encoding='utf-8'))
          assert report['status'] == 'pass'
          assert report['device_trace']['capabilities'] == 31
          assert report['device_trace']['storage_generation'] == 2
          PY

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/virtual-board-abi-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Cortex-M virtual device trace ABI"
          git push
