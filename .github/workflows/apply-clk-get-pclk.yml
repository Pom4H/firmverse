name: Apply clk_get_pclk ROM bridge

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-clk-get-pclk.py
      - .github/workflows/apply-clk-get-pclk.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply observed clk_get_pclk bridge
        run: |
          python scripts/apply-clk-get-pclk.py
          cargo fmt --check || cargo fmt
          cargo test
      - name: Commit generated source change
        run: |
          if git diff --quiet; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/emu.rs
          git commit -m "Model observed PHY6252 clk_get_pclk ABI"
          git push
