name: Format Saturn target once

on:
  push:
    branches: [feat/saturn-plc]
    paths:
      - .github/workflows/rustfmt-saturn-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/saturn-plc
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit formatted sources and remove one-shot workflow
        run: |
          rm .github/workflows/rustfmt-saturn-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format Saturn PLC target"
          git push origin HEAD:feat/saturn-plc
