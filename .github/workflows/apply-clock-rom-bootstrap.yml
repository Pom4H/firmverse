name: Apply clock ROM bootstrap

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-clock-rom-bootstrap.py
      - .github/workflows/apply-clock-rom-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply narrow clock ROM bootstrap patch
        run: |
          python scripts/apply-clock-rom-bootstrap.py
          cargo fmt --check || cargo fmt
          cargo test
      - name: Commit generated source change
        run: |
          if git diff --quiet; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/discovery.rs
          git commit -m "Model observed PHY6252 clock ROM bootstrap ABI"
          git push
