name: Fix Saturn compiler clippy once

on:
  push:
    branches: [feat/saturn-plc]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/saturn-plc
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply clippy fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/controller/saturn_compiler.rs')
          text = path.read_text()
          old = 'bytes.push((element.kind & ELEMENT_MASK) | u8::from(element.invert) * INVERT_FLAG);'
          new = 'bytes.push((element.kind & ELEMENT_MASK) | (u8::from(element.invert) * INVERT_FLAG));'
          if old not in text:
              raise SystemExit('precedence expression not found')
          text = text.replace(old, new, 1)
          old = 'while bytes.len() % 4 != 0 {'
          new = 'while !bytes.len().is_multiple_of(4) {'
          if old not in text:
              raise SystemExit('alignment loop not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit fix and remove one-shot workflow
        run: |
          rm -f .github/workflows/fix-saturn-compiler-clippy-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: satisfy Saturn compiler lints'
          git push origin HEAD:feat/saturn-plc
