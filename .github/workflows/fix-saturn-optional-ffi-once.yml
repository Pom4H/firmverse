name: Fix optional Saturn FFI once

on:
  push:
    branches: [feat/saturn-plc]
    paths:
      - .github/workflows/fix-saturn-optional-ffi-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/saturn-plc
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix capability-gated imports
        run: |
          python3 tools/fix_saturn_optional_ffi_once.py
          cargo fmt --all
      - name: Commit fix and remove one-shot files
        run: |
          rm .github/workflows/fix-saturn-optional-ffi-once.yml tools/fix_saturn_optional_ffi_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix optional Saturn runtime FFI imports"
          git push origin HEAD:feat/saturn-plc
