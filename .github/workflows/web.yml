name: web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: firmverse-web-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/*.rs') }}
          restore-keys: |
            firmverse-web-${{ runner.os }}-

      - name: Build browser lab
        run: bash tools/build_web.sh

      - name: Check browser JavaScript syntax
        run: |
          node --check web/dist/engine-worker.js
          node --check web/dist/elements.js
          node --check web/dist/app.js

      - name: Execute Firmverse WASM smoke
        run: node web/smoke.mjs web/dist/firmverse.wasm

      - name: Publish browser lab artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-browser-lab
          path: web/dist
          if-no-files-found: error
