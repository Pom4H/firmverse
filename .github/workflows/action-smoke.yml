name: integration-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    env:
      ARM_TOOLCHAIN_VERSION: 13.2.rel1
      ARM_TOOLCHAIN_DIR: /home/runner/.cache/arm-gnu-toolchain-13.2.rel1
      SDK_COMMIT: b7202ee56e8d316ea3451dd61266f609e6a676e8
      SDK_ROOT: /home/runner/.cache/phy62xx-sdk-3.1.2
    steps:
      - uses: actions/checkout@v6

      - name: Restore ARM GNU Toolchain
        id: arm-toolchain-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.ARM_TOOLCHAIN_DIR }}
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-${{ runner.os }}

      - name: Download verified ARM GNU Toolchain
        if: steps.arm-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          base="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel"
          work=/tmp/arm-toolchain-download
          rm -rf "$work" "$ARM_TOOLCHAIN_DIR"
          mkdir -p "$work" "$ARM_TOOLCHAIN_DIR"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            "$base/$archive" -o "$work/$archive"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            "$base/$archive.sha256asc" -o "$work/$archive.sha256asc"
          (cd "$work" && sha256sum --check "$archive.sha256asc")
          tar -xJf "$work/$archive" -C "$ARM_TOOLCHAIN_DIR" --strip-components=1
          rm -rf "$work"

      - name: Activate ARM GNU Toolchain
        run: echo "$ARM_TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Build firmware fixtures
        run: make -C firmware clean all

      - name: Single-node action contract
        id: single
        uses: ./
        with:
          firmware: firmware/build/kit-demo.hex
          board: pb03f-kit
          strict: 'true'
          max-insns: '1000000'
          log: firmverse-action-logs/single.log
          expect: |
            UART kit-demo boot

      - name: Check single-node outputs
        run: |
          test -s '${{ steps.single.outputs.log }}'
          test -x '${{ steps.single.outputs.binary }}'

      - name: Restore pinned PHY62XX SDK 3.1.2
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SDK_ROOT }}
          key: phy62xx-sdk-3.1.2-${{ env.SDK_COMMIT }}

      - name: Fetch pinned PHY62XX SDK 3.1.2
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$SDK_ROOT"
          git clone --filter=blob:none https://github.com/xuhongv/PHY6252_6222_SDK.git "$SDK_ROOT"
          git -C "$SDK_ROOT" checkout "$SDK_COMMIT"

      - name: Reset cached SDK
        run: |
          git -C "$SDK_ROOT" reset --hard "$SDK_COMMIT"
          git -C "$SDK_ROOT" clean -fdx

      - name: Build real PHY6252 BLE observer image
        run: make -C firmware/silicon clean all PHY62XX_SDK="$SDK_ROOT"

      - name: Real BLE observer boot regression contract
        uses: ./
        with:
          firmware: firmware/build/rssi-rank-ble.hex
          board: pb03f-kit
          strict: 'true'
          max-insns: '50000000'
          log: firmverse-action-logs/ble-boot.log
          expect: |
            BLE HCI LE_SetScanEnable enabled=1

      - name: Advertising assertion wrapper contract
        run: |
          set -euo pipefail
          stub="$(mktemp)"
          image="$(mktemp)"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case " $* " in *" --max-insns 50000000 "*) ;; *) exit 41;; esac' \
            "printf '%s\\n' 'BLE HCI LE_SetAdvEnable enabled=1'" \
            > "$stub"
          chmod +x "$stub"
          printf '%s\n' ':00000001FF' > "$image"
          FIRMVERSE_BIN="$stub" \
          FIRMVERSE_FIRMWARE="$image" \
          FIRMVERSE_REQUIRE_ADVERTISING=true \
          FIRMVERSE_LOG=firmverse-action-logs/advertising-contract.log \
            bash action/run.sh
          grep -Fxq 'BLE HCI LE_SetAdvEnable enabled=1' \
            firmverse-action-logs/advertising-contract.log

      - name: Mesh action contract
        id: mesh
        uses: ./
        with:
          firmware: firmware/build/rssi-rank.hex
          board: pb03f-kit
          mode: mesh
          world: mesh
          nodes: '2'
          ticks: '200'
          strict: 'true'
          log: firmverse-action-logs/mesh.log
          expect: |
            READY
            WORLD mesh
            NODE n0
            NODE n1
            [n0] UART rssi-rank boot
            [n1] UART rssi-rank boot

      - name: Upload action logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-public-action-smoke
          path: firmverse-action-logs/*.log
          if-no-files-found: warn

  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: firmverse-web-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/*.rs') }}
          restore-keys: |
            firmverse-web-${{ runner.os }}-

      - name: Build browser lab
        run: bash tools/build_web.sh

      - name: Check browser JavaScript syntax
        run: |
          node --check web/dist/engine-worker.js
          node --check web/dist/elements.js
          node --check web/dist/app.js

      - name: Execute Firmverse WASM smoke
        run: node web/smoke.mjs web/dist/firmverse.wasm

      - name: Publish browser lab artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-browser-lab
          path: web/dist
          if-no-files-found: error
