name: public-action-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ARM GCC for fixture firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build firmware fixtures
        run: make -C firmware clean all

      - name: Single-node action contract
        id: single
        uses: ./
        with:
          firmware: firmware/build/kit-demo.hex
          board: pb03f-kit
          strict: 'true'
          max-insns: '1000000'
          log: .firmverse/single.log
          expect: |
            READY
            UART kit-demo boot

      - name: Check single-node outputs
        run: |
          test -s '${{ steps.single.outputs.log }}'
          test -x '${{ steps.single.outputs.binary }}'

      - name: Mesh action contract
        id: mesh
        uses: ./
        with:
          firmware: firmware/build/rssi-rank.hex
          board: pb03f-kit
          mode: mesh
          world: mesh
          nodes: '2'
          ticks: '200'
          strict: 'true'
          log: .firmverse/mesh.log
          expect: |
            READY
            WORLD mesh
            NODE n0
            NODE n1
            [n0] UART rssi-rank boot
            [n1] UART rssi-rank boot

      - name: Upload action logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-public-action-smoke
          path: .firmverse/*.log
          if-no-files-found: error
