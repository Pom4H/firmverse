name: integration-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    env:
      ARM_TOOLCHAIN_VERSION: 13.2.rel1
      ARM_TOOLCHAIN_DIR: /home/runner/.cache/arm-gnu-toolchain-13.2.rel1
    steps:
      - uses: actions/checkout@v6

      - name: Restore ARM GNU Toolchain
        id: arm-toolchain-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.ARM_TOOLCHAIN_DIR }}
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-${{ runner.os }}

      - name: Download verified ARM GNU Toolchain
        if: steps.arm-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          base="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel"
          work=/tmp/arm-toolchain-download
          rm -rf "$work" "$ARM_TOOLCHAIN_DIR"
          mkdir -p "$work" "$ARM_TOOLCHAIN_DIR"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            "$base/$archive" -o "$work/$archive"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            "$base/$archive.sha256asc" -o "$work/$archive.sha256asc"
          (cd "$work" && sha256sum --check "$archive.sha256asc")
          tar -xJf "$work/$archive" -C "$ARM_TOOLCHAIN_DIR" --strip-components=1
          rm -rf "$work"

      - name: Activate ARM GNU Toolchain
        run: echo "$ARM_TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Build firmware fixtures
        run: make -C firmware clean all

      - name: Single-node action contract
        id: single
        uses: ./
        with:
          firmware: firmware/build/kit-demo.hex
          board: pb03f-kit
          strict: 'true'
          max-insns: '1000000'
          log: firmverse-action-logs/single.log
          expect: |
            UART kit-demo boot

      - name: Check single-node outputs
        run: |
          test -s '${{ steps.single.outputs.log }}'
          test -x '${{ steps.single.outputs.binary }}'

      - name: Mesh action contract
        id: mesh
        uses: ./
        with:
          firmware: firmware/build/rssi-rank.hex
          board: pb03f-kit
          mode: mesh
          world: mesh
          nodes: '2'
          ticks: '200'
          strict: 'true'
          log: firmverse-action-logs/mesh.log
          expect: |
            READY
            WORLD mesh
            NODE n0
            NODE n1
            [n0] UART rssi-rank boot
            [n1] UART rssi-rank boot

      - name: Upload action logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-public-action-smoke
          path: firmverse-action-logs/*.log
          if-no-files-found: warn

  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: firmverse-web-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/*.rs') }}
          restore-keys: |
            firmverse-web-${{ runner.os }}-

      - name: Build browser lab
        run: bash tools/build_web.sh

      - name: Check browser JavaScript syntax
        run: |
          node --check web/dist/engine-worker.js
          node --check web/dist/elements.js
          node --check web/dist/app.js

      - name: Execute Firmverse WASM smoke
        run: node web/smoke.mjs web/dist/firmverse.wasm

      - name: Publish browser lab artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-browser-lab
          path: web/dist
          if-no-files-found: error

  browser-refactor-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/browser-lab'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/browser-lab
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo check || true
      - name: Commit generated source and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- Cargo.lock src; then
            exit 0
          fi
          git add Cargo.lock src
          git commit -m 'Format browser runtime and refresh Cargo lock'
          git push origin HEAD:feature/browser-lab
