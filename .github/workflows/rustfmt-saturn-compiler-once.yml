name: Format Saturn compiler once

on:
  push:
    branches: [feat/saturn-plc]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/saturn-plc
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm -f .github/workflows/rustfmt-saturn-compiler-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: rustfmt Saturn compiler'
          git push origin HEAD:feat/saturn-plc
