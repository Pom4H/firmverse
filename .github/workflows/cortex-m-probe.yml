name: Cortex-M probe

on:
  push:
    paths:
      - .github/workflows/cortex-m-probe.yml
      - actions/cortex-m-probe/**
      - tools/cortex_m_probe.py
      - tools/test_cortex_m_probe.py
  pull_request:
    paths:
      - .github/workflows/cortex-m-probe.yml
      - actions/cortex-m-probe/**
      - tools/cortex_m_probe.py
      - tools/test_cortex_m_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test report accounting
        run: python3 -m unittest tools/test_cortex_m_probe.py

      - name: Install fixture compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld

      - name: Install LLVM inspection tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Build deterministic Cortex-M33 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fixture
          cat > target/fixture/fixture.S <<'ASM'
          .syntax unified
          .cpu cortex-m33
          .thumb

          .section .vector_table,"a",%progbits
          .word 0x20040000
          .word reset + 1
          .rept 126
          .word 0
          .endr

          .section .text.reset,"ax",%progbits
          .thumb_func
          .global reset
          .type reset,%function
          reset:
              sub.w sp, sp, #256
              movs r0, #0x42
              str r0, [sp]
              bl deep_frame
              add.w sp, sp, #256
              bl firmverse_done
          1:
              b 1b

          .thumb_func
          .type deep_frame,%function
          deep_frame:
              sub.w sp, sp, #512
              movs r1, #0x33
              str r1, [sp]
              add.w sp, sp, #512
              bx lr

          .thumb_func
          .global firmverse_done
          .type firmverse_done,%function
          firmverse_done:
              b .
          ASM

          cat > target/fixture/linker.ld <<'LD'
          ENTRY(reset)
          MEMORY {
            FLASH (rx)  : ORIGIN = 0x00000000, LENGTH = 1M
            RAM   (rwx) : ORIGIN = 0x20000000, LENGTH = 256K
          }
          SECTIONS {
            .vector_table ORIGIN(FLASH) : { KEEP(*(.vector_table)) } > FLASH
            .text : { *(.text*) } > FLASH
            .rodata : { *(.rodata*) } > FLASH
            .data : { *(.data*) } > RAM AT> FLASH
            .bss (NOLOAD) : { *(.bss*) *(COMMON) } > RAM
          }
          LD

          clang --target=arm-none-eabi -mcpu=cortex-m33 -mthumb \
            -nostdlib -fuse-ld=lld \
            -Wl,-T,target/fixture/linker.ld \
            -o target/fixture/fixture.elf target/fixture/fixture.S

      - name: Execute fixture through local Firmverse action
        id: firmverse
        uses: ./actions/cortex-m-probe
        with:
          elf: target/fixture/fixture.elf
          target: thumbv8m.main-none-eabi
          machine: mps2-an505
          cpu: cortex-m33
          ram-origin: "0x20000000"
          ram-length: "262144"
          flash-origin: "0x00000000"
          flash-length: "1048576"
          stack-limit-bytes: "4096"
          output-dir: target/firmverse-report

      - name: Verify fixture watermark
        shell: bash
        env:
          PEAK_STACK: ${{ steps.firmverse.outputs.peak-stack-bytes }}
        run: |
          set -euo pipefail
          test "$PEAK_STACK" -ge 768
          test "$PEAK_STACK" -le 1024

      - name: Upload execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cortex-m-probe-fixture
          path: target/firmverse-report
          if-no-files-found: error
