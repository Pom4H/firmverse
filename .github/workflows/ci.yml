name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Tool versions
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          rustfmt --version
          python3 --version
      - name: Public repo leak guard
        run: |
          private_marker="dp""ls"
          if git grep -in "$private_marker"; then
            echo 'private product marker leaked into Firmverse'
            exit 1
          fi
      - name: Python tool dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: BLE helpers and Python syntax
        run: |
          test -f host/ble/bluez.py
          test -f host/ble/darwin.swift
          test -f host/ble/darwin.plist
          python3 -m py_compile host/ble/bluez.py tools/phy6252_flash.py tools/phyflash/*.py
      - name: PHY6252 flasher tests
        run: python3 -m unittest discover -s tests -p 'test_phyflash.py' -v
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy — ARMv6-M / PHY6252
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Cargo test
        env:
          RUSTFLAGS: -A unconditional-panic
        run: cargo test --locked
      - name: Firmverse binary
        run: cargo build --quiet --locked
      - name: Firmverse registry smoke
        run: |
          ./target/debug/firmverse socs | grep -q '^phy6252'
          ./target/debug/firmverse socs | grep -q '^ch592f'
          ./target/debug/firmverse boards | grep -q '^pb03f-kit'
          ./target/debug/firmverse worlds | grep -q '^mesh'
      - name: Publish Firmverse binary
        uses: actions/upload-artifact@v7
        with:
          name: firmverse-linux-x86_64
          path: target/debug/firmverse
          if-no-files-found: error

  demo-smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      ARM_TOOLCHAIN_VERSION: 13.2.rel1
      ARM_TOOLCHAIN_DIR: /home/runner/.cache/arm-gnu-toolchain-13.2.rel1
      SDK_COMMIT: b7202ee56e8d316ea3451dd61266f609e6a676e8
      SDK_ROOT: /home/runner/.cache/phy62xx-sdk-3.1.2
    steps:
      - uses: actions/checkout@v6
      - name: Download tested Firmverse binary
        uses: actions/download-artifact@v8
        with:
          name: firmverse-linux-x86_64
          path: target/debug
      - name: Make Firmverse executable
        run: chmod +x target/debug/firmverse

      - name: Restore ARM GNU Toolchain
        id: arm-toolchain-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.ARM_TOOLCHAIN_DIR }}
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-${{ runner.os }}
      - name: Download verified ARM GNU Toolchain
        if: steps.arm-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          base="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel"
          work=/tmp/arm-toolchain-download
          rm -rf "$work" "$ARM_TOOLCHAIN_DIR"
          mkdir -p "$work" "$ARM_TOOLCHAIN_DIR"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            "$base/$archive" -o "$work/$archive"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            "$base/$archive.sha256asc" -o "$work/$archive.sha256asc"
          (cd "$work" && sha256sum --check "$archive.sha256asc")
          tar -xJf "$work/$archive" -C "$ARM_TOOLCHAIN_DIR" --strip-components=1
          rm -rf "$work"
      - name: Activate ARM GNU Toolchain
        run: |
          echo "$ARM_TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          "$ARM_TOOLCHAIN_DIR/bin/arm-none-eabi-gcc" --version

      - name: Build demo firmware
        run: make -C firmware clean all
      - name: Python tool dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Restore pinned PHY62XX SDK 3.1.2
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SDK_ROOT }}
          key: phy62xx-sdk-3.1.2-${{ env.SDK_COMMIT }}
      - name: Fetch pinned PHY62XX SDK 3.1.2
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$SDK_ROOT"
          git clone --filter=blob:none https://github.com/xuhongv/PHY6252_6222_SDK.git "$SDK_ROOT"
          git -C "$SDK_ROOT" checkout "$SDK_COMMIT"
      - name: Reset cached SDK to pinned commit
        run: |
          git -C "$SDK_ROOT" reset --hard "$SDK_COMMIT"
          git -C "$SDK_ROOT" clean -fdx
      - name: Build and validate real vendor BLE image
        run: |
          python3 tools/phy6252_flash.py \
            --sdk-root "$SDK_ROOT" \
            --vendor-ble-smoke \
            --dry-run \
            | tee /tmp/sdk312-ble.log
          grep -q 'BLE provenance: GCC vendor RF + BLE host' /tmp/sdk312-ble.log
          grep -q 'Dry run complete' /tmp/sdk312-ble.log

      - name: Simple board smoke
        run: |
          printf 'ADC 3300 1650 2500 3300\nIN 00000200\nCONNECT\nCCCD 1\nWRITE 4849\n' \
            | timeout 3 ./target/debug/firmverse --strict-mmio --raw firmware/build/kit-demo.hex \
            | tee /tmp/kit.log || true
          grep -q READY /tmp/kit.log
          grep -q 'UART kit-demo boot' /tmp/kit.log
          grep -q '^GPIO ' /tmp/kit.log
          grep -q 'UART rx ' /tmp/kit.log
      - name: RSSI rank sticky colours
        run: |
          {
            echo 'scan 111111111111 -40'
            echo 'scan 222222222222 -50'
            echo 'scan 333333333333 -60'
            echo 'scan 444444444444 -70'
            echo 'scan 555555555555 -80'
            echo 'gone 111111111111'
            echo 'scan 666666666666 -30'
          } | timeout 3 ./target/debug/firmverse --strict-mmio --raw firmware/build/rssi-rank.hex \
            | tee /tmp/rank.log || true
          grep -q READY /tmp/rank.log
          grep -q 'UART rssi-rank boot' /tmp/rank.log
          grep -q 'UART color R <- 111111111111' /tmp/rank.log
          grep -q 'UART color Y <- 444444444444' /tmp/rank.log
          grep -q 'UART color W <- 555555555555' /tmp/rank.log
          grep -q 'UART vacant R 111111111111' /tmp/rank.log
          grep -q 'UART color R <- 666666666666' /tmp/rank.log
          grep -Eq '^GPIO [0-9a-f]{8} 00401091$' /tmp/rank.log
      - name: Two-node mesh hears the neighbour
        run: |
          ./target/debug/firmverse sim --strict --once --ticks 200 --raw --world mesh \
            --node a=firmware/build/rssi-rank.hex \
            --node b=firmware/build/rssi-rank.hex \
            | tee /tmp/mesh.log
          grep -q '^READY$' /tmp/mesh.log
          grep -q '^WORLD mesh ' /tmp/mesh.log
          grep -q '^NODE a ' /tmp/mesh.log
          grep -q '^NODE b ' /tmp/mesh.log
          grep -q '\[a\] UART rssi-rank boot' /tmp/mesh.log
          grep -q '\[b\] UART rssi-rank boot' /tmp/mesh.log
          grep -q '\[a\] UART color R <-' /tmp/mesh.log
          grep -q '\[b\] UART color R <-' /tmp/mesh.log
      - name: Full capability stress
        run: |
          printf 'ADC 3000 1750 2250 3100\nIN 00000200\nCONNECT\nCCCD 1\nWRITE 434150\nTICK 512\n' \
            | timeout 4 ./target/debug/firmverse --strict-mmio --raw firmware/build/capability-demo.hex \
            | tee /tmp/cap.log || true
          grep -q READY /tmp/cap.log
          grep -q 'UART capability-demo boot' /tmp/cap.log
          grep -q 'UART capability-demo uart1' /tmp/cap.log
          grep -q 'UART dma-uart' /tmp/cap.log
          grep -q 'UART dma-probe pass' /tmp/cap.log
          grep -q 'UART selftest osal=1 queue=1 flash=1 aes=1 ctrl=1' /tmp/cap.log
          grep -q '^GPIO ' /tmp/cap.log
          grep -Eq '^PWM( [0-9a-f]{4}){6}$' /tmp/cap.log
          grep -q '^FRAME 434150$' /tmp/cap.log
      - name: Persistent NOR restart
        run: |
          rm -f /tmp/phy6252-cap.flash /tmp/flash-first.log /tmp/flash-second.log
          PHY6252_FLASH_STATE=/tmp/phy6252-cap.flash \
            timeout 15 ./target/debug/firmverse --strict-mmio --once --max-insns 1000000 firmware/build/capability-demo.hex \
            > /tmp/flash-first.log 2>&1 || true
          test -s /tmp/phy6252-cap.flash
          grep -q 'dma-probe pass' /tmp/flash-first.log
          grep -q 'selftest osal=1 queue=1 flash=1 aes=1 ctrl=1' /tmp/flash-first.log
          PHY6252_FLASH_STATE=/tmp/phy6252-cap.flash \
            timeout 15 ./target/debug/firmverse --strict-mmio --once --max-insns 1000000 firmware/build/capability-demo.hex \
            > /tmp/flash-second.log 2>&1 || true
          grep -q 'FLASH state: restored 262144 bytes' /tmp/flash-second.log
          grep -q 'dma-probe pass' /tmp/flash-second.log
          grep -q 'selftest osal=1 queue=1 flash=1 aes=1 ctrl=1' /tmp/flash-second.log

  attest:
    if: always()
    needs: [test, demo-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Publish combined commit status
        uses: actions/github-script@v8
        with:
          script: |
            const ok = '${{ needs.test.result }}' === 'success' &&
              '${{ needs.demo-smoke.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'firmverse/ci',
              description: ok ? 'rust + flasher + SDK 3.1.2 BLE + stress passed' : 'One or more Firmverse CI jobs failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
