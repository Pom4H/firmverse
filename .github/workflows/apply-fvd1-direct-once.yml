name: Apply FVD1 directly once

on:
  push:
    paths:
      - .github/workflows/apply-fvd1-direct-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Apply prepared source migration
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/fv.part* | tr -d '\n' | base64 -d > /tmp/patch_firmverse.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/patch_firmverse.py")
          text = path.read_text(encoding="utf-8")
          slash = chr(92)
          old_anchor = "'''        script = \"" + slash + "n\".join("
          new_anchor = "'''        script = \"" + slash + slash + "n\".join("
          old_output = "        script = \"" + slash + "n\".join(commands)"
          new_output = "        script = \"" + slash + slash + "n\".join(commands)"
          if old_anchor not in text or old_output not in text:
              raise SystemExit("migration newline anchors were not found")
          text = text.replace(old_anchor, new_anchor, 1)
          text = text.replace(old_output, new_output, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile /tmp/patch_firmverse.py
          python3 /tmp/patch_firmverse.py

      - name: Start Cortex-M deterministically from its vector table
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/cortex_m_probe.py")
          text = path.read_text(encoding="utf-8")
          old_context = 'with tempfile.TemporaryDirectory(prefix="firmverse-") as temporary:'
          new_context = 'with tempfile.TemporaryDirectory(prefix=".firmverse-", dir=Path.cwd()) as temporary:'
          old_write = '        pattern_path.write_bytes(bytes([PATTERN_BYTE]) * pattern_length)\n'
          new_write = (
              old_write
              + '        if not pattern_path.is_file():\n'
              + '            raise RuntimeError("failed to create the GDB stack pattern file")\n'
              + '        print(\n'
              + '            f"Firmverse GDB exchange: {pattern_path} "\n'
              + '            f"({pattern_path.stat().st_size} bytes)"\n'
              + '        )\n'
          )
          if old_context not in text or old_write not in text:
              raise SystemExit("workspace GDB patch anchors were not found")
          text = text.replace(old_context, new_context, 1)
          text = text.replace(old_write, new_write, 1)

          path_replacements = [
              (
                  "f'restore \"{quote_gdb_path(pattern_path)}\" binary '",
                  "f'restore {quote_gdb_path(pattern_path)} binary '",
              ),
              (
                  "f'dump binary memory \"{quote_gdb_path(dump_path)}\" '",
                  "f'dump binary memory {quote_gdb_path(dump_path)} '",
              ),
              (
                  "f'dump binary memory \"{quote_gdb_path(trace_path)}\" '",
                  "f'dump binary memory {quote_gdb_path(trace_path)} '",
              ),
          ]
          for old, new in path_replacements:
              if old not in text:
                  raise SystemExit(f"GDB path anchor was not found: {old}")
              text = text.replace(old, new, 1)

          remote_marker = '            f"target remote 127.0.0.1:{port}",\n'
          remote_with_diagnostic = (
              remote_marker
              + '            "x/2wx 0x00000000",\n'
              + '            f"shell ls -l {quote_gdb_path(pattern_path)}",\n'
          )
          if remote_marker not in text:
              raise SystemExit("GDB remote anchor was not found")
          text = text.replace(remote_marker, remote_with_diagnostic, 1)

          breakpoint_marker = '            f"hbreak *0x{completion_address:x}",\n'
          context_and_breakpoint = (
              '            "set $control = 0",\n'
              + '            "set $msp = *(unsigned int*)0x00000000",\n'
              + '            "set $sp = *(unsigned int*)0x00000000",\n'
              + '            "set $pc = (*(unsigned int*)0x00000004) & 0xfffffffe",\n'
              + '            "set $xpsr = 0x01000000",\n'
              + '            "info registers msp sp pc xpsr control",\n'
              + breakpoint_marker
          )
          if breakpoint_marker not in text:
              raise SystemExit("GDB breakpoint anchor was not found")
          text = text.replace(breakpoint_marker, context_and_breakpoint, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile tools/cortex_m_probe.py
          python3 -m unittest tools/test_cortex_m_probe.py

      - name: Install Cortex-M execution dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-arm gdb-multiarch

      - name: Install LLVM inspection tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Build deterministic Cortex-M33 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fixture
          cat > target/fixture/device.S <<'ASM'
          .syntax unified
          .cpu cortex-m33
          .thumb

          .section .vector_table,"a",%progbits
          .word 0x20040000
          .word reset + 1
          .rept 126
          .word 0
          .endr

          .section .data.device_trace,"aw",%progbits
          .align 2
          .global firmverse_device_trace
          .type firmverse_device_trace,%object
          firmverse_device_trace:
              .word 0x31445646, 1, 64, 1, 0x1f, 3, 2, 0x12345678
              .word 32, 0x87654321, 2, 2, 0xaabbccdd, 1, 0xddccbbaa, 0

          .section .text.reset,"ax",%progbits
          .thumb_func
          .global reset
          reset:
              sub.w sp, sp, #256
              movs r0, #0x42
              str r0, [sp]
              add.w sp, sp, #256
              bl firmverse_done
          1:
              b 1b

          .thumb_func
          .global firmverse_done
          .type firmverse_done,%function
          firmverse_done:
              b .
          ASM
          cat > target/fixture/linker.ld <<'LD'
          ENTRY(reset)
          MEMORY {
            FLASH (rx)  : ORIGIN = 0x00000000, LENGTH = 1M
            RAM   (rwx) : ORIGIN = 0x20000000, LENGTH = 256K
          }
          SECTIONS {
            .vector_table ORIGIN(FLASH) : { KEEP(*(.vector_table)) } > FLASH
            .text : { *(.text*) } > FLASH
            .rodata : { *(.rodata*) } > FLASH
            .data : { *(.data*) } > RAM AT> FLASH
            .bss (NOLOAD) : { *(.bss*) *(COMMON) } > RAM
          }
          LD
          clang --target=arm-none-eabi -mcpu=cortex-m33 -mthumb \
            -nostdlib -fuse-ld=lld \
            -Wl,-T,target/fixture/linker.ld \
            -o target/fixture/device.elf target/fixture/device.S

      - name: Execute real ELF and read FVD1 from guest RAM
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc +1.98.0 -vV | sed -n 's/^host: //p')"
          llvm_root="$(rustc +1.98.0 --print sysroot)/lib/rustlib/${host}/bin"
          python3 tools/cortex_m_probe.py \
            --elf target/fixture/device.elf \
            --target thumbv8m.main-none-eabi \
            --machine mps2-an505 \
            --cpu cortex-m33 \
            --done-symbol firmverse_done \
            --device-trace-symbol firmverse_device_trace \
            --required-device-capabilities 0x1f \
            --stack-limit-bytes 4096 \
            --output-dir target/virtual-board-report \
            --llvm-nm "$llvm_root/llvm-nm" \
            --llvm-size "$llvm_root/llvm-size"

      - name: Verify structured device evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          report = json.load(open("target/virtual-board-report/firmverse-report.json", encoding="utf-8"))
          trace = report["device_trace"]
          assert report["status"] == "pass"
          assert trace["status"] == "pass"
          assert trace["capabilities"] == 31
          assert trace["button_events"] == 3
          assert trace["display_frames"] == 2
          assert trace["trng_bytes"] == 32
          assert trace["storage_generation"] == 2
          assert trace["secure_element_ops"] == 1
          PY

      - name: Commit verified implementation and remove migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration
          rm -f \
            .github/workflows/apply-fvd1-direct-once.yml \
            .github/workflows/apply-fvd1-once.yml \
            .github/workflows/virtual-board-abi-once.yml \
            .github/workflows/run-virtual-board-migration-once.yml \
            .github/workflows/inspect-recovered-migration-once.yml \
            .github/workflows/finalize-cortex-probe-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Cortex-M virtual device trace ABI"
          git push
