name: Fix Saturn CLI cfg once

on:
  push:
    branches: [feat/saturn-plc]
    paths:
      - .github/workflows/fix-saturn-cli-cfg-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/saturn-plc
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Gate native-only CLI helper
        run: |
          python3 tools/fix_saturn_cli_cfg_once.py
          cargo fmt --all
      - name: Commit fix and remove one-shot files
        run: |
          rm .github/workflows/fix-saturn-cli-cfg-once.yml tools/fix_saturn_cli_cfg_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Gate Saturn CLI parser on native runtime"
          git push origin HEAD:feat/saturn-plc
