name: refactor-board-tui

on:
  push:
    branches: [refactor/phy6252-layout-docs-actions]
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/phy6252-layout-docs-actions
      - name: Apply structural refactor
        run: python3 tools/refactor_board_tui.py
      - name: Commit generated Rust refactor
        run: |
          git add src/tui.rs src/sim.rs src/soc/phy6252/cmd.rs
          if git diff --cached --quiet; then
            echo 'No Rust refactor changes left to apply'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make TUI consume board and SoC pin profiles'
          git push origin HEAD:refactor/phy6252-layout-docs-actions
