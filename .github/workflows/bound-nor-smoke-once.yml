name: Bound persistent NOR smoke once

on:
  push:
    branches: [feat/saturn-plc]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/saturn-plc
      - name: Bound legacy NOR regression
        run: |
          python3 -c 'from pathlib import Path; p=Path(".github/workflows/ci.yml"); s=p.read_text(); needle="            ./target/debug/firmverse --strict-mmio --once --max-insns 1000000 firmware/build/capability-demo.hex \\\n"; assert s.count(needle)==2, s.count(needle); p.write_text(s.replace(needle, "            timeout 15 ./target/debug/firmverse --strict-mmio --once --max-insns 1000000 firmware/build/capability-demo.hex \\\n"))'
      - name: Commit bounded smoke and remove one-shot workflow
        run: |
          rm -f .github/workflows/bound-nor-smoke-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: bound persistent NOR regression runtime'
          git push origin HEAD:feat/saturn-plc
