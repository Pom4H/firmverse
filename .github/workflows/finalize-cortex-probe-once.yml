name: Finalize Cortex-M execution backend once

on:
  push:
    paths:
      - .github/workflows/finalize-cortex-probe-once.yml

permissions:
  contents: write

concurrency:
  group: finalize-cortex-probe-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Make Flash accounting load-section aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          probe = Path("tools/cortex_m_probe.py")
          text = probe.read_text()
          if "FLASH_SECTION_PREFIXES" not in text:
              marker = "PATTERN_BYTE = 0xA5\n"
              addition = '''PATTERN_BYTE = 0xA5
FLASH_SECTION_PREFIXES = (
    ".vector_table",
    ".text",
    ".rodata",
    ".data",
    ".ARM.exidx",
    ".ARM.extab",
    ".gnu.sgstubs",
)
'''
              if marker not in text:
                  raise SystemExit("Firmverse probe constants changed unexpectedly")
              text = text.replace(marker, addition, 1)

              marker = '''def in_range(address: int, origin: int, length: int) -> bool:
    return origin <= address < origin + length


'''
              addition = '''def in_range(address: int, origin: int, length: int) -> bool:
    return origin <= address < origin + length


def is_flash_section(name: str) -> bool:
    return any(
        name == prefix or name.startswith(f"{prefix}.")
        for prefix in FLASH_SECTION_PREFIXES
    )


'''
              if marker not in text:
                  raise SystemExit("Firmverse range helper changed unexpectedly")
              text = text.replace(marker, addition, 1)

              old = '''    for section in sections:
        if in_range(section.address, flash_origin, flash_length):
            flash += section.size
        if in_range(section.address, ram_origin, ram_length):
'''
              new = '''    for section in sections:
        if is_flash_section(section.name) and in_range(
            section.address, flash_origin, flash_length
        ):
            flash += section.size
        if in_range(section.address, ram_origin, ram_length):
'''
              if old not in text:
                  raise SystemExit("Firmverse section classifier changed unexpectedly")
              text = text.replace(old, new, 1)
              probe.write_text(text)

          tests = Path("tools/test_cortex_m_probe.py")
          test_text = tests.read_text()
          if "test_debug_sections_at_zero_are_not_flash" not in test_text:
              marker = '''    def test_stack_watermark_finds_deepest_write(self) -> None:
'''
              addition = '''    def test_debug_sections_at_zero_are_not_flash(self) -> None:
        sections = [
            cortex_m_probe.Section(".vector_table", 512, 0),
            cortex_m_probe.Section(".text", 2048, 512),
            cortex_m_probe.Section(".debug_info", 500_000, 0),
            cortex_m_probe.Section(".symtab", 100_000, 0),
        ]
        flash, static_ram, _ = cortex_m_probe.classify_sections(
            sections,
            flash_origin=0,
            flash_length=1024 * 1024,
            ram_origin=0x20000000,
            ram_length=256 * 1024,
        )
        self.assertEqual(flash, 512 + 2048)
        self.assertEqual(static_ram, 0)

    def test_stack_watermark_finds_deepest_write(self) -> None:
'''
              if marker not in test_text:
                  raise SystemExit("Firmverse unit test layout changed unexpectedly")
              tests.write_text(test_text.replace(marker, addition, 1))
          PY

      - name: Unit-test accounting
        run: python3 -m unittest tools/test_cortex_m_probe.py

      - name: Install deterministic fixture toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld

      - name: Install LLVM inspection tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Build Cortex-M33 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fixture
          cat > target/fixture/fixture.S <<'ASM'
          .syntax unified
          .cpu cortex-m33
          .thumb
          .section .vector_table,"a",%progbits
          .word 0x20040000
          .word reset + 1
          .rept 126
          .word 0
          .endr
          .section .text.reset,"ax",%progbits
          .thumb_func
          .global reset
          .type reset,%function
          reset:
              sub.w sp, sp, #256
              movs r0, #0x42
              str r0, [sp]
              bl deep_frame
              add.w sp, sp, #256
              bl firmverse_done
          1:
              b 1b
          .thumb_func
          .type deep_frame,%function
          deep_frame:
              sub.w sp, sp, #512
              movs r1, #0x33
              str r1, [sp]
              add.w sp, sp, #512
              bx lr
          .thumb_func
          .global firmverse_done
          .type firmverse_done,%function
          firmverse_done:
              b .
          ASM
          cat > target/fixture/linker.ld <<'LD'
          ENTRY(reset)
          MEMORY {
            FLASH (rx)  : ORIGIN = 0x00000000, LENGTH = 1M
            RAM   (rwx) : ORIGIN = 0x20000000, LENGTH = 256K
          }
          SECTIONS {
            .vector_table ORIGIN(FLASH) : { KEEP(*(.vector_table)) } > FLASH
            .text : { *(.text*) } > FLASH
            .rodata : { *(.rodata*) } > FLASH
            .data : { *(.data*) } > RAM AT> FLASH
            .bss (NOLOAD) : { *(.bss*) *(COMMON) } > RAM
          }
          LD
          clang --target=arm-none-eabi -mcpu=cortex-m33 -mthumb \
            -nostdlib -fuse-ld=lld \
            -Wl,-T,target/fixture/linker.ld \
            -o target/fixture/fixture.elf target/fixture/fixture.S

      - name: Execute fixture through Firmverse
        id: firmverse
        uses: ./actions/cortex-m-probe
        with:
          elf: target/fixture/fixture.elf
          target: thumbv8m.main-none-eabi
          machine: mps2-an505
          cpu: cortex-m33
          ram-origin: "0x20000000"
          ram-length: "262144"
          flash-origin: "0x00000000"
          flash-length: "1048576"
          stack-limit-bytes: "4096"
          output-dir: target/firmverse-report

      - name: Verify execution evidence
        shell: bash
        env:
          PEAK_STACK: ${{ steps.firmverse.outputs.peak-stack-bytes }}
        run: |
          set -euo pipefail
          test "$PEAK_STACK" -ge 768
          test "$PEAK_STACK" -le 1024
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("target/firmverse-report/firmverse-report.json").read_text())
          assert report["flash_bytes"] < 4096, report
          assert report["status"] == "pass", report
          PY

      - name: Commit verified backend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/finalize-cortex-probe-once.yml
          git add -A
          git commit -m "Make Cortex-M resource reports load-section aware"
          git pull --rebase origin main
          git push origin main
