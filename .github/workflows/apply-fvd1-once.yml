name: Apply virtual device ABI once

on:
  push:
    paths:
      - .github/workflows/apply-fvd1-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Reconstruct and apply source migration
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/fv.part* | tr -d '\n' | base64 -d > /tmp/patch_firmverse.py
          python3 -m py_compile /tmp/patch_firmverse.py
          python3 /tmp/patch_firmverse.py
          python3 -m py_compile tools/cortex_m_probe.py
          python3 -m unittest tools/test_cortex_m_probe.py

      - name: Install fixture compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld

      - name: Install LLVM inspection tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Build deterministic Cortex-M33 FVD1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fixture
          cat > target/fixture/device.S <<'ASM'
          .syntax unified
          .cpu cortex-m33
          .thumb

          .section .vector_table,"a",%progbits
          .word 0x20040000
          .word reset + 1
          .rept 126
          .word 0
          .endr

          .section .data.device_trace,"aw",%progbits
          .align 2
          .global firmverse_device_trace
          .type firmverse_device_trace,%object
          firmverse_device_trace:
              .word 0x31445646, 1, 64, 1, 0x1f, 3, 2, 0x12345678
              .word 32, 0x87654321, 2, 2, 0xaabbccdd, 1, 0xddccbbaa, 0

          .section .text.reset,"ax",%progbits
          .thumb_func
          .global reset
          reset:
              sub.w sp, sp, #256
              movs r0, #0x42
              str r0, [sp]
              add.w sp, sp, #256
              bl firmverse_done
          1:
              b 1b

          .thumb_func
          .global firmverse_done
          .type firmverse_done,%function
          firmverse_done:
              b .
          ASM
          cat > target/fixture/linker.ld <<'LD'
          ENTRY(reset)
          MEMORY {
            FLASH (rx)  : ORIGIN = 0x00000000, LENGTH = 1M
            RAM   (rwx) : ORIGIN = 0x20000000, LENGTH = 256K
          }
          SECTIONS {
            .vector_table ORIGIN(FLASH) : { KEEP(*(.vector_table)) } > FLASH
            .text : { *(.text*) } > FLASH
            .rodata : { *(.rodata*) } > FLASH
            .data : { *(.data*) } > RAM AT> FLASH
            .bss (NOLOAD) : { *(.bss*) *(COMMON) } > RAM
          }
          LD
          clang --target=arm-none-eabi -mcpu=cortex-m33 -mthumb \
            -nostdlib -fuse-ld=lld \
            -Wl,-T,target/fixture/linker.ld \
            -o target/fixture/device.elf target/fixture/device.S

      - name: Execute modified local Firmverse action
        id: firmverse
        uses: ./actions/cortex-m-probe
        with:
          elf: target/fixture/device.elf
          target: thumbv8m.main-none-eabi
          machine: mps2-an505
          cpu: cortex-m33
          device-trace-symbol: firmverse_device_trace
          required-device-capabilities: "0x1f"
          stack-limit-bytes: "4096"
          output-dir: target/virtual-board-report

      - name: Verify virtual-device evidence
        shell: bash
        env:
          DEVICE_STATUS: ${{ steps.firmverse.outputs.device-status }}
          DEVICE_CAPABILITIES: ${{ steps.firmverse.outputs.device-capabilities }}
          REPORT_JSON: ${{ steps.firmverse.outputs.report-json }}
        run: |
          set -euo pipefail
          test "$DEVICE_STATUS" = pass
          test "$DEVICE_CAPABILITIES" = 31
          python3 - "$REPORT_JSON" <<'PY'
          import json
          import sys

          trace = json.load(open(sys.argv[1], encoding="utf-8"))["device_trace"]
          assert trace["button_events"] == 3
          assert trace["display_frames"] == 2
          assert trace["trng_bytes"] == 32
          assert trace["storage_generation"] == 2
          assert trace["secure_element_ops"] == 1
          PY

      - name: Commit verified implementation and remove migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration
          rm -f \
            .github/workflows/apply-fvd1-once.yml \
            .github/workflows/virtual-board-abi-once.yml \
            .github/workflows/run-virtual-board-migration-once.yml \
            .github/workflows/inspect-recovered-migration-once.yml \
            .github/workflows/finalize-cortex-probe-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Cortex-M virtual device trace ABI"
          git push
