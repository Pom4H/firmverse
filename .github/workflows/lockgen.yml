name: lockgen

on:
  push:
    branches: [chore/sync-firmverse-lock]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Let Cargo minimally reconcile the existing lockfile
        run: cargo check --quiet
      - name: Show lockfile diff
        run: git diff -- Cargo.lock
      - name: Commit generated lockfile if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Sync Cargo.lock with Firmverse package name'
          git push origin HEAD:chore/sync-firmverse-lock
