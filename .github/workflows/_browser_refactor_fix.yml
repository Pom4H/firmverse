name: browser-refactor-fix

on:
  push:
    branches: [feature/browser-lab]
    paths:
      - .github/workflows/_browser_refactor_fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/browser-lab
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format, refresh Cargo lock and probe native compile
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          cargo fmt --all
          cargo check
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- Cargo.lock src; then
            git add Cargo.lock src
            git commit -m 'Format browser runtime and refresh Cargo lock'
            git push origin HEAD:feature/browser-lab
          fi
      - name: Report compile result
        if: steps.probe.outputs.status != '0'
        run: exit '${{ steps.probe.outputs.status }}'
