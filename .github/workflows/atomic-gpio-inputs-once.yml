name: Add atomic GPIO input masks once

on:
  push:
    paths:
      - .github/workflows/atomic-gpio-inputs-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Apply atomic input-mask API
        run: python3 tools/apply_atomic_gpio_inputs_once.py
      - name: Verify native and browser runtimes
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          bash tools/build_web.sh
          node web/smoke.mjs web/dist/firmverse.wasm
      - name: Commit migration and remove temporary files
        run: |
          set -euo pipefail
          rm .github/workflows/atomic-gpio-inputs-once.yml
          rm tools/apply_atomic_gpio_inputs_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply simultaneous GPIO inputs atomically"
          git pull --rebase origin main
          git push origin main
