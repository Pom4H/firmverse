name: Format PHY6252 OSAL once

# One-shot formatter; remove after the verified formatting commit.
on:
  push:
    paths:
      - .github/workflows/format-osal-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/soc/phy6252/osal.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style(phy6252): format OSAL queue fix'
            git push origin HEAD:main
          fi
