name: Add verified GPIO sleep wake once

on:
  push:
    paths:
      - .github/workflows/gpio-sleep-wake-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpio-sleep-wake-once
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Make WFI wait for a GPIO edge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/soc/phy6252/chip.rs')
          source = path.read_text()

          source, count = re.subn(
              r'(\n\s*ext_in: Arc<AtomicU32>,\n)',
              r'\1    sleep_entries: u32,\n    wake_count: u32,\n    last_wake_pin: Option<u32>,\n',
              source,
              count=1,
          )
          assert count == 1, count
          source, count = re.subn(
              r'(\n\s*ext_in: Arc::new\(AtomicU32::new\(0\)\),\n)',
              r'\1            sleep_entries: 0,\n            wake_count: 0,\n            last_wake_pin: None,\n',
              source,
              count=1,
          )
          assert count == 1, count

          method_pattern = r'(    pub fn gpio_bank\(&self\) -> Rc<RefCell<GpioBank>> \{\n        Rc::clone\(&self\.gpio\)\n    \}\n)'
          methods = r'''\1
    pub fn sleeping(&self) -> bool {
        self.processor.sleeping
    }

    pub fn sleep_entries(&self) -> u32 {
        self.sleep_entries
    }

    pub fn wake_count(&self) -> u32 {
        self.wake_count
    }

    pub fn last_wake_pin(&self) -> Option<u32> {
        self.last_wake_pin
    }

    fn set_external_inputs(&mut self, next: u32) {
        let next = next & GPIO_PIN_MASK;
        let current = self.ext_in.load(Ordering::Relaxed);
        let rising = next & !current;
        self.ext_in.store(next, Ordering::Relaxed);
        if rising != 0 && self.processor.sleeping {
            self.processor.sleeping = false;
            self.wake_count = self.wake_count.saturating_add(1);
            self.last_wake_pin = Some(rising.trailing_zeros());
        }
    }
'''
          source, count = re.subn(method_pattern, methods, source, count=1)
          assert count == 1, count

          command_pattern = re.compile(
              r'            ChipCmd::In\(value\) => \{.*?            ChipCmd::Write\(bytes\) => \{',
              re.S,
          )
          commands = '''            ChipCmd::In(value) => {
                self.set_external_inputs(value);
                Ok(Apply::Continue)
            }
            ChipCmd::Pin { bit, high } => {
                let mask = 1u32 << bit;
                let current = self.ext_in.load(Ordering::Relaxed);
                let next = if high { current | mask } else { current & !mask };
                self.set_external_inputs(next);
                Ok(Apply::Continue)
            }
            ChipCmd::Write(bytes) => {'''
          source, count = command_pattern.subn(commands, source, count=1)
          assert count == 1, count

          old_sleep = '        if self.processor.sleeping {\n            self.processor.sleeping = false;\n        }\n'
          new_sleep = '''        if self.processor.sleeping {
            self.collect(&mut delta);
            self.collect_bootrom(&mut delta);
            if live_clock && !self.bootrom.active() {
                self.clock_ms = self.clock_ms.wrapping_add(1);
                let _ = mailbox::set_tick(&mut self.processor, self.clock_ms);
            }
            return delta;
        }
'''
          assert old_sleep in source
          source = source.replace(old_sleep, new_sleep, 1)

          old_step = '            self.processor.step();\n            self.insn += 1;\n            if self.reset_requested.replace(false) {\n'
          new_step = '''            self.processor.step();
            self.insn += 1;
            if self.processor.sleeping {
                self.sleep_entries = self.sleep_entries.saturating_add(1);
                break;
            }
            if self.reset_requested.replace(false) {
'''
          assert old_step in source
          source = source.replace(old_step, new_step, 1)
          path.write_text(source)

          path = Path('src/web_runtime.rs')
          source = path.read_text()
          old_snapshot = '            "insns": node.chip.insn,\n            "stopped": node.chip.stopped(),\n            "gpio": {\n'
          new_snapshot = '''            "insns": node.chip.insn,
            "stopped": node.chip.stopped(),
            "power": {
                "sleeping": node.chip.sleeping(),
                "sleepEntries": node.chip.sleep_entries(),
                "wakeCount": node.chip.wake_count(),
                "lastWakePin": node.chip.last_wake_pin(),
            },
            "gpio": {
'''
          assert old_snapshot in source
          path.write_text(source.replace(old_snapshot, new_snapshot, 1))
          PY

      - name: Verify native and browser runtimes
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          bash tools/build_web.sh
          node web/smoke.mjs web/dist/firmverse.wasm

      - name: Commit migration and remove trigger
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/gpio-sleep-wake-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Wake sleeping Cortex-M guests from GPIO edges"
          git pull --rebase origin main
          git push origin main
