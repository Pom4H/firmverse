name: Add Saturn browser compiler RPC once

on:
  push:
    branches: [feat/saturn-plc]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/saturn-plc
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add compiler RPC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/web_runtime.rs')
          text = path.read_text()

          old = 'use crate::controller::saturn::{INPUT_TERMINALS, OUTPUT_TERMINALS};\n'
          new = old + 'use crate::controller::saturn_compiler::{compile_control_ir, parse_control_ir_json, CONTROL_IR_SCHEMA};\n'
          if old not in text:
              raise SystemExit('Saturn import anchor not found')
          text = text.replace(old, new, 1)

          old = '        "registry" => Ok(json!({ "ok": true, "registry": registry() })),\n        "new" => {'
          new = '''        "registry" => Ok(json!({ "ok": true, "registry": registry() })),
        "compileSaturnControlIr" => {
            let control_ir = request
                .get("controlIr")
                .ok_or_else(|| "field controlIr is required".to_string())?;
            let source = serde_json::to_string(control_ir)
                .map_err(|error| format!("cannot encode Saturn ControlIR: {error}"))?;
            let ir = parse_control_ir_json(&source)?;
            let compiled = compile_control_ir(&ir)?;
            let listing = compiled
                .listing
                .iter()
                .map(|row| {
                    json!({
                        "index": row.index,
                        "id": row.id,
                        "type": row.kind,
                        "inputs": row.inputs,
                        "params": row.params,
                        "comment": row.comment,
                    })
                })
                .collect::<Vec<_>>();
            Ok(json!({
                "ok": true,
                "artifact": {
                    "format": "fbdbin",
                    "encoding": "hex",
                    "data": hex(&compiled.fbdbin),
                    "bytes": compiled.fbdbin.len(),
                    "elements": compiled.element_count,
                    "screens": compiled.screen_count,
                    "rtl": compiled.required_rtl,
                },
                "listing": listing,
            }))
        }
        "new" => {'''
          if old not in text:
              raise SystemExit('dispatch anchor not found')
          text = text.replace(old, new, 1)

          old = '        "controllers": controllers,\n        "pins": {'
          new = '        "controllers": controllers,\n        "compilerSchemas": { "saturn-plc": CONTROL_IR_SCHEMA },\n        "pins": {'
          if old not in text:
              raise SystemExit('registry anchor not found')
          text = text.replace(old, new, 1)

          old = '''    #[test]
    fn registry_rpc_does_not_require_a_lab() {
        let response = dispatch(r#"{\"op\":\"registry\"}"#).expect("registry rpc");
        assert_eq!(response["ok"], true);
        assert_eq!(response["registry"]["socs"][0]["id"], "phy6252");
    }
}'''
          new = '''    #[test]
    fn registry_rpc_does_not_require_a_lab() {
        let response = dispatch(r#"{\"op\":\"registry\"}"#).expect("registry rpc");
        assert_eq!(response["ok"], true);
        assert_eq!(response["registry"]["socs"][0]["id"], "phy6252");
        assert_eq!(
            response["registry"]["compilerSchemas"]["saturn-plc"],
            CONTROL_IR_SCHEMA
        );
    }

    #[test]
    fn saturn_compiler_rpc_does_not_require_a_lab() {
        let request = json!({
            "op": "compileSaturnControlIr",
            "controlIr": {
                "schema": CONTROL_IR_SCHEMA,
                "project": {
                    "name": "Browser compiler",
                    "version": "1",
                    "buildTime": "2026-08-29"
                },
                "elements": [
                    { "id": "di", "type": "INP_PIN", "params": [1] },
                    { "id": "do", "type": "OUT_PIN", "inputs": ["di"], "params": [1] }
                ]
            }
        });
        let response = dispatch(&request.to_string()).expect("compile Saturn ControlIR");
        assert_eq!(response["ok"], true);
        assert_eq!(response["artifact"]["format"], "fbdbin");
        assert_eq!(response["artifact"]["encoding"], "hex");
        assert_eq!(response["artifact"]["elements"], 2);
        assert_eq!(response["listing"].as_array().expect("listing").len(), 2);
        assert!(response["artifact"]["data"]
            .as_str()
            .expect("artifact hex")
            .len()
            > 8);
    }
}'''
          if old not in text:
              raise SystemExit('test anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit RPC and remove one-shot workflow
        run: |
          rm -f .github/workflows/add-saturn-browser-compiler-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: expose Saturn compiler to Studio runtime'
          git push origin HEAD:feat/saturn-plc
