name: Add Saturn browser compiler RPC once

on:
  push:
    branches: [feat/saturn-plc]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/saturn-plc
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add compiler RPC
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d >/tmp/add-saturn-web.py
          python3 /tmp/add-saturn-web.py
          cargo fmt --all
      - name: Commit RPC and remove one-shot workflow
        run: |
          rm -f .github/workflows/add-saturn-browser-compiler-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: expose Saturn compiler to Studio runtime'
          git push origin HEAD:feat/saturn-plc
