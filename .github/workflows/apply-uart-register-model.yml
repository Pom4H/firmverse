name: Apply stateful UART register model

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-uart-register-model.py
      - .github/workflows/apply-uart-register-model.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply UART model
        run: |
          python scripts/apply-uart-register-model.py
          cargo fmt --check || cargo fmt
          cargo test
      - name: Commit generated source change
        run: |
          if git diff --quiet; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bus.rs src/discovery.rs
          git commit -m "Model PHY6252 UART divisor and control registers"
          git push
