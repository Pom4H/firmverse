name: Prepare isolated PLC integration workspace
on:
  push:
    branches: [automation/plc-unify-20260918]
    paths: [.github/workflows/plc-sandbox.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ebbec33b304dd07af0b17018b6f221449de12052
          submodules: recursive
          persist-credentials: false
          path: firmverse
      - uses: actions/checkout@v7.0.1
        with:
          repository: Pom4H/open-device
          ref: 007ada38d2cce27b37413f38952ca11b919842c1
          persist-credentials: false
          path: open-device
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Prepare offline source dependencies and compiler tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pack/toolchain pack/tools pack/firmverse/.cargo
          cd firmverse
          cargo vendor --locked vendor > ../pack/firmverse/.cargo/config.toml
          cd ..
          tar --exclude=.git -cf - firmverse | tar -xf - -C pack
          (cd open-device && bun install --frozen-lockfile)
          tar --exclude=.git -cf - open-device | tar -xf - -C pack
          cp "$(command -v bun)" pack/tools/bun
          sysroot=$(rustc --print sysroot)
          cp -a "$sysroot/bin" "$sysroot/lib" pack/toolchain/
          rm -rf pack/toolchain/lib/rustlib/*/analysis
          curl --fail --location --retry 2 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz | tar -xz -C pack
          (rustc -Vv; cargo -V; bun -v) > pack/toolchain-versions.txt
          tar -czf /tmp/plc-offline-sources.tar.gz -C pack firmverse open-device tools toolchain-versions.txt
          tar -czf /tmp/plc-offline-compilers.tar.gz -C pack toolchain wasi-sdk-24.0-x86_64-linux
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: plc-offline-sources
          path: /tmp/plc-offline-sources.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: plc-offline-compilers
          path: /tmp/plc-offline-compilers.tar.gz
          retention-days: 1
