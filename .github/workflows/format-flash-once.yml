name: Format abstract flasher once

on:
  push:
    branches:
      - feature/abstract-flasher-harness

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/abstract-flasher-harness
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/flash.rs src/lib.rs src/bin/phy6252-flash.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style: format abstract flasher'
            git push origin HEAD:feature/abstract-flasher-harness
          fi
