name: Firmverse firmware test
description: "Run embedded firmware in Firmverse directly from GitHub Actions"
branding:
  icon: cpu
  color: purple

inputs:
  firmware:
    description: "Path to the firmware HEX file in the caller repository"
    required: true
  board:
    description: "Firmverse board profile"
    required: false
    default: pb03f-kit
  mode:
    description: "Execution mode: single or mesh"
    required: false
    default: single
  world:
    description: "World used by mesh mode"
    required: false
    default: mesh
  nodes:
    description: "Number of identical firmware nodes in mesh mode"
    required: false
    default: '2'
  ticks:
    description: "Number of deterministic world ticks in mesh mode"
    required: false
    default: '200'
  strict:
    description: "Fail on unmodeled SoC MMIO or vendor ROM behavior"
    required: false
    default: 'true'
  require-advertising:
    description: "Fail unless PHY6252 firmware reaches HCI LE advertising enable (50M instructions by default)"
    required: false
    default: 'false'
  max-insns:
    description: "Optional instruction budget override"
    required: false
    default: ''
  expect:
    description: "Optional newline-separated fixed strings that must appear in the log"
    required: false
    default: ''
  log:
    description: "Log file path, relative to the caller workspace unless absolute"
    required: false
    default: firmverse.log

outputs:
  log:
    description: "Absolute path to the Firmverse log"
    value: ${{ steps.run.outputs.log }}
  binary:
    description: "Absolute path to the built Firmverse binary"
    value: ${{ steps.build.outputs.binary }}
  probe-status:
    description: "Generic Cortex-M PROBE status, when emitted"
    value: ${{ steps.run.outputs.probe-status }}
  instructions:
    description: "Generic Cortex-M executed instruction count"
    value: ${{ steps.run.outputs.instructions }}
  cycles:
    description: "Generic Cortex-M simulated cycle count"
    value: ${{ steps.run.outputs.cycles }}
  stack-used:
    description: "Generic Cortex-M stack high-water bytes"
    value: ${{ steps.run.outputs.stack-used }}
  stack-window:
    description: "Generic Cortex-M scanned stack window bytes"
    value: ${{ steps.run.outputs.stack-window }}
  stack-saturated:
    description: "Whether the stack reached the bottom of the scanned window"
    value: ${{ steps.run.outputs.stack-saturated }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Select CPU profile
      id: cpu-profile
      shell: bash
      env:
        FIRMVERSE_BOARD: ${{ inputs.board }}
      run: |
        set -euo pipefail
        case "$FIRMVERSE_BOARD" in
          hardware-wallet-dev)
            echo 'name=armv7em' >> "$GITHUB_OUTPUT"
            echo 'cargo_args=--no-default-features --features armv7em' >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo 'name=armv6m' >> "$GITHUB_OUTPUT"
            echo 'cargo_args=' >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Compute Firmverse cache identity
      id: cache-identity
      shell: bash
      run: |
        set -euo pipefail
        rust_id="$(rustc --version --verbose | sed -n 's/^commit-hash: //p' | cut -c1-12)"
        source_id="$({
          cd "$GITHUB_ACTION_PATH"
          sha256sum action.yml Cargo.toml Cargo.lock
          find src -type f -print0 | sort -z | xargs -0 sha256sum
        } | sha256sum | cut -c1-16)"
        echo "rust=$rust_id" >> "$GITHUB_OUTPUT"
        echo "source=$source_id" >> "$GITHUB_OUTPUT"

    - name: Restore Firmverse build cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ${{ github.action_path }}/target
        key: firmverse-action-${{ runner.os }}-${{ runner.arch }}-${{ steps.cpu-profile.outputs.name }}-${{ steps.cache-identity.outputs.rust }}-${{ steps.cache-identity.outputs.source }}
        restore-keys: |
          firmverse-action-${{ runner.os }}-${{ runner.arch }}-${{ steps.cpu-profile.outputs.name }}-${{ steps.cache-identity.outputs.rust }}-
          firmverse-action-${{ runner.os }}-${{ runner.arch }}-${{ steps.cpu-profile.outputs.name }}-

    - name: Prepare pinned zmu backend
      shell: bash
      env:
        ZMU_REV: 72feb753fea97babc00cc88f2c75e814efc1bfd2
      run: |
        set -euo pipefail
        zmu_dir="${GITHUB_ACTION_PATH}/third_party/zmu"
        if [[ -f "$zmu_dir/zmu_cortex_m/Cargo.toml" ]]; then
          exit 0
        fi
        rm -rf "$zmu_dir"
        mkdir -p "$zmu_dir"
        git -C "$zmu_dir" init -q
        git -C "$zmu_dir" remote add origin https://github.com/jjkt/zmu.git
        git -C "$zmu_dir" fetch -q --depth 1 origin "$ZMU_REV"
        git -C "$zmu_dir" checkout -q --detach FETCH_HEAD

    - name: Build Firmverse
      id: build
      shell: bash
      env:
        FIRMVERSE_CARGO_ARGS: ${{ steps.cpu-profile.outputs.cargo_args }}
      run: |
        set -euo pipefail
        read -r -a feature_args <<< "$FIRMVERSE_CARGO_ARGS"
        cargo build \
          --release \
          --locked \
          --bin firmverse \
          "${feature_args[@]}" \
          --manifest-path "${GITHUB_ACTION_PATH}/Cargo.toml"
        binary="${GITHUB_ACTION_PATH}/target/release/firmverse"
        test -x "$binary"
        echo "binary=$binary" >> "$GITHUB_OUTPUT"

    - name: Run firmware in Firmverse
      id: run
      shell: bash
      env:
        FIRMVERSE_BIN: ${{ steps.build.outputs.binary }}
        FIRMVERSE_FIRMWARE: ${{ inputs.firmware }}
        FIRMVERSE_BOARD: ${{ inputs.board }}
        FIRMVERSE_MODE: ${{ inputs.mode }}
        FIRMVERSE_WORLD: ${{ inputs.world }}
        FIRMVERSE_NODES: ${{ inputs.nodes }}
        FIRMVERSE_TICKS: ${{ inputs.ticks }}
        FIRMVERSE_STRICT: ${{ inputs.strict }}
        FIRMVERSE_REQUIRE_ADVERTISING: ${{ inputs.require-advertising }}
        FIRMVERSE_MAX_INSNS: ${{ inputs.max-insns }}
        FIRMVERSE_EXPECT: ${{ inputs.expect }}
        FIRMVERSE_LOG: ${{ inputs.log }}
      run: bash "${GITHUB_ACTION_PATH}/action/run.sh"
